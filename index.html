<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🔧 Máy Turing Crayon</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body {
    margin:0; padding:0; width:100%; height:100%;
    overflow:hidden; background:#fdf6e3;
    font-family:'Comic Sans MS','Chalkboard SE','Segoe Print',cursive;
    touch-action:manipulation;
  }
  #app {
    width:100%; height:100%;
    display:flex; flex-direction:column;
    padding:4px; gap:3px;
    max-width:520px; margin:0 auto;
  }
  header { flex-shrink:0; text-align:center; padding:1px 0; }
  h1 {
    margin:0; font-size:clamp(14px,4.2vw,18px);
    color:#2d3142;
    text-shadow:2px 2px 0 #ffd166, -1px -1px 0 #ef476f;
    transform:rotate(-0.5deg);
  }
  #hud {
    display:flex; justify-content:center; gap:4px;
    flex-shrink:0; flex-wrap:wrap;
  }
  .stat {
    background:#fff;
    border:2px solid #2d3142;
    border-radius:10px 4px 12px 5px / 5px 12px 4px 10px;
    padding:2px 8px;
    font-size:clamp(10px,2.9vw,12px);
    color:#2d3142; font-weight:bold;
    box-shadow:2px 2px 0 rgba(45,49,66,0.35);
    white-space:nowrap;
  }
  .stat span { color:#ef476f; }
  .stat:nth-child(2) span { color:#06d6a0; }
  .stat:nth-child(3) span { color:#118ab2; }
  .stat.pulse { animation:pulseStat 0.35s; }
  @keyframes pulseStat {
    0%,100% { transform:scale(1); }
    50% { transform:scale(1.18); background:#ffd166; }
  }

  /* Dãy số — chiếm 42% */
  #targetPanel {
    flex-shrink:0;
    background:linear-gradient(135deg, #fffef8, #fff8e7);
    border:3px solid #2d3142;
    border-radius:14px 5px 16px 7px / 7px 16px 5px 14px;
    box-shadow:3px 3px 0 rgba(45,49,66,0.35);
    padding:5px 4px;
    display:flex; flex-direction:column;
  }
  #targetTitle {
    text-align:center;
    font-size:clamp(10px,2.9vw,12px);
    color:#2d3142; font-weight:bold;
    margin-bottom:3px;
    flex-shrink:0;
  }
  #slotsRow {
    display:flex;
    justify-content:center;
    gap:4px;
    flex-wrap:wrap;
  }
  .slot {
    display:flex; flex-direction:column;
    align-items:center;
    background:#fff;
    border:2.5px solid #2d3142;
    border-radius:9px 4px 9px 4px / 4px 9px 4px 9px;
    box-shadow:2px 2px 0 rgba(45,49,66,0.3);
    padding:3px;
    min-width:52px;
    max-width:64px;
    flex:0 0 auto;
  }
  .slot-main {
    font-size:clamp(20px,5.5vw,26px);
    font-weight:bold;
    color:#2d3142;
    line-height:1.1;
    min-height:26px;
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
  }
  .slot-label {
    font-size:clamp(7px,2vw,9px);
    color:#888;
    font-family:sans-serif;
    margin-bottom:2px;
  }
  .mini-grid {
    display:grid;
    grid-template-columns:repeat(5, 1fr);
    gap:1px;
    width:100%;
    margin-top:2px;
  }
  .mini-cell {
    font-size:clamp(8px,2.4vw,10px);
    font-family:sans-serif;
    font-weight:bold;
    color:#2d3142;
    background:#e8f4ff;
    border:1px solid #99c9e8;
    border-radius:3px;
    text-align:center;
    padding:1px 0;
    cursor:pointer;
    transition:all 0.1s;
    -webkit-appearance:none;
    line-height:1;
  }
  .mini-cell:active { transform:scale(0.9); }
  .mini-cell.eliminated {
    background:#ddd;
    color:#aaa;
    text-decoration:line-through;
    border-color:#bbb;
  }
  #targetHint {
    text-align:center;
    font-size:clamp(8px,2.4vw,10px);
    color:#118ab2;
    font-style:italic;
    margin-top:3px;
    flex-shrink:0;
  }

  /* Câu hỏi — chiếm phần còn lại */
  #questionsPanel {
    flex:1; min-height:0;
    background:#fffef8;
    border:2px solid #2d3142;
    border-radius:11px 4px 13px 6px / 6px 13px 4px 11px;
    box-shadow:2px 2px 0 rgba(45,49,66,0.3);
    padding:4px 6px;
    display:flex; flex-direction:column;
    overflow:hidden;
  }
  #qFilter {
    display:flex; gap:3px; margin-bottom:3px;
    flex-shrink:0;
    overflow-x:auto;
    padding-bottom:2px;
  }
  .filter-btn {
    font-family:inherit;
    font-size:clamp(8px,2.3vw,10px);
    padding:2px 6px;
    border:1.5px solid #2d3142;
    border-radius:7px;
    background:#fff;
    color:#2d3142;
    cursor:pointer;
    white-space:nowrap;
    -webkit-appearance:none;
    flex-shrink:0;
  }
  .filter-btn.active { background:#ffd166; font-weight:bold; }
  #questionsList {
    flex:1; overflow-y:auto;
    display:flex; flex-direction:column; gap:2px;
    -webkit-overflow-scrolling:touch;
    padding-right:2px;
  }
  .q-btn {
    padding:6px 8px;
    background:#fff;
    border:1.5px solid #2d3142;
    border-radius:8px 3px 9px 4px / 4px 9px 3px 8px;
    font-family:inherit;
    font-size:clamp(9px,2.6vw,11px);
    color:#2d3142;
    font-weight:bold;
    text-align:left;
    cursor:pointer;
    box-shadow:1.5px 1.5px 0 rgba(45,49,66,0.25);
    -webkit-appearance:none;
    line-height:1.2;
    width:100%;
    flex-shrink:0;
    display:flex; align-items:center; gap:4px;
    transition:all 0.1s;
  }
  .q-btn:active {
    transform:translate(1px,1px);
    box-shadow:0.5px 0.5px 0 rgba(45,49,66,0.25);
    background:#ffd166;
  }
  .q-btn.used {
    pointer-events:none;
    transform:none !important;
  }
  .q-btn.used.yes {
    background:#d4f8e4;
    border-color:#06d6a0;
    cursor:default;
  }
  .q-btn.used.no {
    background:#ffe4e6;
    border-color:#ef476f;
    cursor:default;
  }
  .q-num {
    font-size:0.85em;
    color:#888;
    min-width:14px;
    text-align:right;
    flex-shrink:0;
  }
  .q-dot {
    width:7px; height:7px;
    border-radius:50%;
    flex-shrink:0;
  }
  .q-dot.tier1 { background:#06d6a0; }
  .q-dot.tier2 { background:#ffd166; }
  .q-dot.tier3 { background:#ef476f; }
  .q-text {
    flex:1;
    line-height:1.2;
  }
  .q-answer {
    font-weight:bold;
    padding:1px 6px;
    border-radius:5px;
    font-size:0.85em;
    white-space:nowrap;
    flex-shrink:0;
  }
  .q-btn.used.yes .q-answer {
    background:#06d6a0;
    color:#fff;
  }
  .q-btn.used.no .q-answer {
    background:#ef476f;
    color:#fff;
  }

  #guessBtn {
    flex-shrink:0;
    padding:9px;
    background:#ef476f;
    color:#fff;
    border:3px solid #2d3142;
    border-radius:12px 4px 14px 6px / 6px 14px 4px 12px;
    font-family:inherit;
    font-weight:bold;
    font-size:clamp(12px,3.3vw,15px);
    cursor:pointer;
    box-shadow:2.5px 2.5px 0 #2d3142;
    -webkit-appearance:none;
    letter-spacing:1px;
    width:100%;
  }
  #guessBtn:active {
    transform:translate(1.5px,1.5px);
    box-shadow:1px 1px 0 #2d3142;
  }

  /* Toast */
  #toast {
    position:fixed;
    top:50%; left:50%;
    transform:translate(-50%, -50%) scale(0.3);
    background:#fff;
    border:4px solid #2d3142;
    border-radius:18px;
    padding:14px 30px;
    font-family:'Comic Sans MS', cursive;
    font-size:clamp(24px,7vw,34px);
    font-weight:bold;
    box-shadow:5px 5px 0 rgba(45,49,66,0.5);
    z-index:1000;
    pointer-events:none;
    opacity:0;
    transition:all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  #toast.show { opacity:1; transform:translate(-50%, -50%) scale(1); }
  #toast.yes { background:#06d6a0; color:#fff; }
  #toast.no { background:#ef476f; color:#fff; }

  /* Overlay */
  #overlay {
    position:fixed; inset:0;
    background:rgba(253, 246, 227, 0.97);
    display:flex; flex-direction:column;
    justify-content:center; align-items:center;
    text-align:center; padding:16px;
    z-index:100;
    overflow-y:auto;
  }
  #overlay.hidden { display:none; }
  #overlay h2 {
    font-size:clamp(18px,5.5vw,26px);
    color:#ef476f;
    margin:0 0 8px;
    text-shadow:2px 2px 0 #ffd166;
    transform:rotate(-2deg);
  }
  #overlay h2.win { color:#06d6a0; }
  #overlay p {
    font-size:clamp(11px,3.2vw,14px);
    color:#2d3142;
    margin:4px 0;
    line-height:1.4;
    max-width:340px;
  }
  #overlay b { color:#06d6a0; }
  .secret-reveal {
    display:flex; gap:5px; margin:8px 0;
    justify-content:center; flex-wrap:wrap;
  }
  .secret-num {
    width:36px; height:36px;
    background:#ffd166;
    border:3px solid #2d3142;
    border-radius:10px 3px 10px 3px / 3px 10px 3px 10px;
    display:flex; align-items:center; justify-content:center;
    font-size:17px; font-weight:bold; color:#2d3142;
    box-shadow:2px 2px 0 rgba(45,49,66,0.4);
  }
  #overlay button {
    margin-top:8px;
    padding:10px 24px;
    font-size:clamp(12px,3.6vw,15px);
    font-weight:bold;
    font-family:inherit;
    color:#fff;
    background:#ef476f;
    border:3px solid #2d3142;
    border-radius:12px 4px 14px 6px / 6px 14px 4px 12px;
    box-shadow:2.5px 2.5px 0 #2d3142;
    cursor:pointer;
    -webkit-appearance:none;
  }
  #overlay button:active { transform:translate(1.5px,1.5px); box-shadow:1px 1px 0 #2d3142; }
  #overlay button.secondary { background:#118ab2; margin-left:5px; }
  #overlay button.tertiary { background:#06d6a0; }

  .mode-btn {
    display:block;
    width:100%; max-width:280px;
    margin:5px auto;
    padding:10px;
    font-family:inherit;
    font-size:clamp(12px,3.6vw,14px);
    font-weight:bold;
    color:#2d3142;
    background:#fff;
    border:3px solid #2d3142;
    border-radius:12px 4px 14px 6px / 6px 14px 4px 12px;
    box-shadow:2.5px 2.5px 0 rgba(45,49,66,0.4);
    cursor:pointer;
    text-align:left;
    -webkit-appearance:none;
  }
  .mode-btn:active { transform:translate(1.5px,1.5px); box-shadow:1px 1px 0 rgba(45,49,66,0.4); }
  .mode-btn .desc {
    display:block;
    font-size:0.8em;
    font-weight:normal;
    color:#666;
    margin-top:2px;
  }
  .mode-btn.active { background:#ffd166; }

  .name-input {
    padding:9px 12px;
    font-size:14px;
    font-family:inherit;
    border:2.5px solid #2d3142;
    border-radius:11px;
    background:#fff;
    text-align:center;
    width:200px; max-width:85%;
    color:#2d3142;
    outline:none;
    margin:5px 0;
  }
  .name-input:focus { border-color:#ef476f; box-shadow:0 0 0 3px rgba(239,71,111,0.2); }

  .digit-picker {
    display:grid;
    grid-template-columns:repeat(5, 1fr);
    gap:4px;
    justify-items:center;
    margin-top:6px;
    max-width:280px;
  }
  .digit-btn {
    width:100%;
    max-width:44px;
    height:40px;
    background:#fff;
    border:2.5px solid #2d3142;
    border-radius:9px 3px 9px 3px / 3px 9px 3px 9px;
    font-family:inherit;
    font-size:18px; font-weight:bold;
    color:#2d3142;
    cursor:pointer;
    box-shadow:2px 2px 0 rgba(45,49,66,0.3);
    -webkit-appearance:none;
  }
  .digit-btn:active { transform:translate(1px,1px); box-shadow:1px 1px 0 rgba(45,49,66,0.3); background:#ffd166; }
  .digit-btn.active { background:#ffd166; }

  .guess-row {
    display:flex; gap:5px; justify-content:center; margin:6px 0;
    flex-wrap:wrap;
  }
  .guess-digit {
    width:46px; height:56px;
    background:#fff;
    border:3px solid #2d3142;
    border-radius:11px 3px 11px 3px / 3px 11px 3px 11px;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    box-shadow:2px 2.5px 0 rgba(45,49,66,0.35);
    cursor:pointer;
    position:relative;
  }
  .guess-digit .val { font-size:22px; font-weight:bold; color:#2d3142; line-height:1; }
  .guess-digit .val.empty { color:#ccc; font-size:18px; }
  .guess-digit .pos { position:absolute; bottom:2px; font-size:7px; color:#888; font-family:sans-serif; }

  .leaderboard {
    width:100%; max-width:340px;
    margin:5px auto;
    background:#fff;
    border:2.5px solid #2d3142;
    border-radius:11px;
    padding:5px 8px;
    text-align:left;
  }
  .leaderboard h3 {
    margin:0 0 4px;
    font-size:12px;
    color:#2d3142;
    text-align:center;
    border-bottom:2px dashed #ffd166;
    padding-bottom:3px;
  }
  .lb-row {
    display:flex; justify-content:space-between;
    padding:2px 3px;
    font-size:11px;
    color:#2d3142;
    border-radius:4px;
  }
  .lb-row:first-child { background:#ffd166; font-weight:bold; }
  .lb-row .rank { width:20px; }
  .lb-row .name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lb-row .pts { color:#ef476f; font-weight:bold; }
</style>
</head>
<body>

<div id="app">
  <header>
    <h1>🔧 MÁY TURING CRAYON</h1>
  </header>

  <div id="hud">
    <div class="stat" id="lvStat">Lv <span id="levelStat">1</span></div>
    <div class="stat" id="qStat">❓ <span id="qLeft">8</span></div>
    <div class="stat" id="scStat">🏆 <span id="scoreTotal">0</span></div>
  </div>

  <div id="targetPanel">
    <div id="targetTitle">🎯 DÃY SỐ CẦN TÌM</div>
    <div id="slotsRow"></div>
    <div id="targetHint">💡 Chạm số để gạch bỏ (loại trừ)</div>
  </div>

  <div id="questionsPanel">
    <div id="qFilter"></div>
    <div id="questionsList"></div>
  </div>

  <button id="guessBtn" type="button">🎯 ĐOÁN DÃY SỐ</button>
</div>

<div id="toast"></div>

<div id="overlay">
  <h2>🔧 MÁY TURING CRAYON</h2>
  <p>Tìm dãy số bí ẩn bằng cách đặt câu hỏi Có/Không!</p>
  <p style="font-size:11px;color:#666">Gạch bỏ số không khả thi trên mini-grid để hỗ trợ suy luận</p>
  <button id="startBtn" type="button">BẮT ĐẦU 🖍️</button>
</div>

<script>
(function() {
'use strict';

// ============ MODES ============
var MODES = {
  easy:   { name:'Dễ',     startNums:3, min:0, max:9 },
  normal: { name:'Thường', startNums:4, min:0, max:9 },
  hard:   { name:'Khó',    startNums:5, min:0, max:9 }
};

// ============ STATE ============
var currentMode = 'normal';
var secret = [];
var numCount = 3;
var minVal = 0;
var maxVal = 9;
var questionsLeft = 8;
var questionsTotal = 8;
var askedMap = {};
var questionCounter = 0;
var gameOver = false;
var totalScore = 0;
var streak = 0;
var playerName = 'Người chơi';
var currentGuess = [];
var currentSelectedVal = null;
var level = 1;
var eliminated = [];
var currentFilter = 'all';
var allQuestionsCache = [];

// DOM
var els = {};

// ============ READY ============
function ready(fn) {
  if (document.readyState !== 'loading') fn();
  else document.addEventListener('DOMContentLoaded', fn);
}

ready(function() {
  els.qLeftEl = document.getElementById('qLeft');
  els.scoreTotalEl = document.getElementById('scoreTotal');
  els.levelStatEl = document.getElementById('levelStat');
  els.questionsListEl = document.getElementById('questionsList');
  els.qFilterEl = document.getElementById('qFilter');
  els.overlay = document.getElementById('overlay');
  els.guessBtn = document.getElementById('guessBtn');
  els.toast = document.getElementById('toast');
  els.qStat = document.getElementById('qStat');
  els.slotsRow = document.getElementById('slotsRow');

  try {
    playerName = localStorage.getItem('turingCrayonName') || 'Người chơi';
    totalScore = parseInt(localStorage.getItem('turingCrayonScore')) || 0;
  } catch(e) {}
  els.scoreTotalEl.textContent = totalScore;

  document.getElementById('startBtn').onclick = showModeSelect;
  els.guessBtn.onclick = openGuessPanel;
});

// ============ TOAST ============
var toastTimer = null;
function showToast(text, type) {
  els.toast.textContent = text;
  els.toast.className = 'show ' + type;
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { els.toast.className = ''; }, 900);
  try { if (navigator.vibrate) navigator.vibrate(type === 'yes' ? 25 : [25,35,25]); } catch(e) {}
  playBeep(type === 'yes');
}

// ============ SOUND ============
var audioCtx = null;
function playBeep(high) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    var now = audioCtx.currentTime;
    osc.type = 'sine';
    osc.frequency.setValueAtTime(high ? 880 : 440, now);
    osc.frequency.exponentialRampToValueAtTime(high ? 1100 : 300, now + 0.1);
    gain.gain.setValueAtTime(0.08, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
    osc.start(now); osc.stop(now + 0.15);
  } catch(e) {}
}

// ============ PULSE ============
function pulseStat(el) {
  if (!el) return;
  el.classList.remove('pulse');
  void el.offsetWidth;
  el.classList.add('pulse');
}

// ============ OVERLAY ============
function showOverlay(html) {
  els.overlay.innerHTML = html;
  els.overlay.classList.remove('hidden');
}
function hideOverlay() { els.overlay.classList.add('hidden'); }

// ============ MODE SELECT ============
function showModeSelect() {
  var html = '<h2>🔧 CHỌN CHẾ ĐỘ</h2>';
  html += '<p>Tên của bạn:</p>';
  html += '<input id="nameInput" class="name-input" type="text" maxlength="16" placeholder="Nhập tên..." value="' + escapeHtml(playerName) + '">';
  html += '<p style="margin-top:6px;font-size:11px;color:#666">Chọn độ khó:</p>';
  for (var key in MODES) {
    var m = MODES[key];
    html += '<button class="mode-btn' + (key === currentMode ? ' active' : '') + '" data-mode="' + key + '" type="button">';
    html += '📚 ' + m.name;
    html += '<span class="desc">Bắt đầu ' + m.startNums + ' số (0-9)</span>';
    html += '</button>';
  }
  html += '<button id="goBtn" type="button" style="margin-top:10px">VÀO GAME 🖍️</button>';
  showOverlay(html);

  var btns = els.overlay.querySelectorAll('.mode-btn');
  for (var i = 0; i < btns.length; i++) {
    (function(btn) {
      btn.onclick = function() {
        var all = els.overlay.querySelectorAll('.mode-btn');
        for (var j = 0; j < all.length; j++) all[j].classList.remove('active');
        btn.classList.add('active');
        currentMode = btn.getAttribute('data-mode');
      };
    })(btns[i]);
  }

  document.getElementById('goBtn').onclick = function() {
    var input = document.getElementById('nameInput');
    var name = (input.value || '').trim() || 'Ẩn danh';
    if (name.length > 16) name = name.slice(0, 16);
    playerName = name;
    try { localStorage.setItem('turingCrayonName', name); } catch(e) {}
    level = 1;
    totalScore = 0;
    streak = 0;
    els.scoreTotalEl.textContent = 0;
    els.levelStatEl.textContent = 1;
    startGame();
  };
}

// ============ LEVEL CONFIG ============
function getLevelConfig(lv) {
  lv = Math.max(1, parseInt(lv, 10) || 1);
  var m = MODES[currentMode] || MODES.normal;
  var nums = Math.min(7, m.startNums + Math.floor((lv - 1) / 3));
  nums = Math.max(3, nums);
  var qs = 8 + (nums - 3) * 2 + Math.min(4, lv - 1);
  return { nums: nums, min: m.min || 0, max: m.max || 9, questions: qs };
}

// ============ START ============
function startGame() {
  var cfg = getLevelConfig(level);
  numCount = cfg.nums;
  minVal = cfg.min;
  maxVal = cfg.max;
  questionsLeft = cfg.questions;
  questionsTotal = cfg.questions;
  askedMap = {};
  questionCounter = 0;
  gameOver = false;
  currentGuess = [];
  currentSelectedVal = null;
  currentFilter = 'all';
  for (var i = 0; i < numCount; i++) currentGuess.push(null);

  eliminated = [];
  for (var e = 0; e < numCount; e++) eliminated.push({});

  secret = [];
  for (var j = 0; j < numCount; j++) {
    secret.push(minVal + Math.floor(Math.random() * (maxVal - minVal + 1)));
  }

  els.qLeftEl.textContent = questionsLeft;
  els.levelStatEl.textContent = level;

  renderSlots();
  renderFilter();
  buildQuestionsList();
  hideOverlay();
}

// ============ RENDER SLOTS ============
function renderSlots() {
  var html = '';
  for (var i = 0; i < numCount; i++) {
    html += '<div class="slot" data-slot="' + i + '">';
    html += '<div class="slot-main">?</div>';
    html += '<div class="slot-label">Số ' + (i+1) + '</div>';
    html += '<div class="mini-grid" data-slot="' + i + '">';
    for (var v = minVal; v <= maxVal; v++) {
      var elim = eliminated[i] && eliminated[i][v];
      html += '<button class="mini-cell' + (elim ? ' eliminated' : '') + '" data-slot="' + i + '" data-val="' + v + '" type="button">' + v + '</button>';
    }
    html += '</div>';
    html += '</div>';
  }
  els.slotsRow.innerHTML = html;

  var cells = els.slotsRow.querySelectorAll('.mini-cell');
  for (var c = 0; c < cells.length; c++) {
    (function(cell) {
      cell.onclick = function(e) {
        if (e) e.stopPropagation();
        var slot = parseInt(cell.getAttribute('data-slot'), 10);
        var val = parseInt(cell.getAttribute('data-val'), 10);
        toggleEliminate(slot, val, cell);
      };
    })(cells[c]);
  }
}

function toggleEliminate(slot, val, cell) {
  if (gameOver) return;
  if (!eliminated[slot]) eliminated[slot] = {};
  if (eliminated[slot][val]) {
    delete eliminated[slot][val];
    cell.classList.remove('eliminated');
  } else {
    eliminated[slot][val] = true;
    cell.classList.add('eliminated');
    try { if (navigator.vibrate) navigator.vibrate(10); } catch(e) {}
  }
}

// ============ FILTER ============
var FILTERS = [
  { id:'all',  name:'Tất cả' },
  { id:'tier1', name:'🟢 Cơ bản' },
  { id:'tier2', name:'🟡 TB' },
  { id:'tier3', name:'🔴 Khó' }
];

function renderFilter() {
  var html = '';
  for (var i = 0; i < FILTERS.length; i++) {
    var f = FILTERS[i];
    html += '<button class="filter-btn' + (currentFilter === f.id ? ' active' : '') + '" data-filter="' + f.id + '" type="button">' + f.name + '</button>';
  }

  var btns = els.qFilterEl.querySelectorAll('.filter-btn');
  for (var b = 0; b < btns.length; b++) {
    (function(btn) {
      btn.onclick = function() {
        currentFilter = btn.getAttribute('data-filter');
        renderFilter();
        renderQuestions();
      };
    })(btns[b]);
  }
}

// ============ CÂU HỎI — 50 câu, 10 nhóm ============
function isPrime(n) {
  if (n < 2) return false;
  for (var i = 2; i * i <= n; i++) if (n % i === 0) return false;
  return true;
}

function buildAllQuestions(len) {
  len = Math.max(3, Math.min(7, parseInt(len, 10) || 3));
  var qs = [];
  var i;

  // NHÓM 1 — Chẵn/lẻ từng vị trí (tier 1)
  for (i = 0; i < len; i++) {
    (function(idx) {
      qs.push({
        id: 'even_' + idx, tier: 1,
        text: 'Số thứ ' + (idx+1) + ' là số chẵn?',
        fn: function(s) { return s[idx] % 2 === 0; }
      });
    })(i);
  }
  // Lớn hơn 5 từng vị trí (tier 1)
  for (i = 0; i < len; i++) {
    (function(idx) {
      qs.push({
        id: 'gt5_' + idx, tier: 1,
        text: 'Số thứ ' + (idx+1) + ' lớn hơn 5?',
        fn: function(s) { return s[idx] > 5; }
      });
    })(i);
  }

  // NHÓM 2 — So sánh 2 vị trí (tier 2)
  for (i = 0; i < len - 1; i++) {
    (function(idx) {
      qs.push({
        id: 'cmp_' + idx, tier: 2,
        text: 'Số thứ ' + (idx+1) + ' lớn hơn số thứ ' + (idx+2) + '?',
        fn: function(s) { return s[idx] > s[idx+1]; }
      });
    })(i);
  }
  if (len >= 3) {
    qs.push({
      id: 'cmp_first_last', tier: 2,
      text: 'Số đầu lớn hơn số cuối?',
      fn: function(s) { return s[0] > s[len-1]; }
    });
    qs.push({
      id: 'eq_first_last', tier: 2,
      text: 'Số đầu bằng số cuối?',
      fn: function(s) { return s[0] === s[len-1]; }
    });
  }

  // NHÓM 3 — Tổng / Hiệu (tier 2/3)
  qs.push({
    id: 'sum_even', tier: 2,
    text: 'Tổng các số là số chẵn?',
    fn: function(s) { var t=0; for (var k=0;k<s.length;k++) t+=s[k]; return t%2===0; }
  });
  qs.push({
    id: 'sum_gt', tier: 2,
    text: 'Tổng các số lớn hơn ' + Math.floor(len * 4.5) + '?',
    fn: function(s) { var t=0; for (var k=0;k<s.length;k++) t+=s[k]; return t > Math.floor(len*4.5); }
  });
  qs.push({
    id: 'sum_div3', tier: 2,
    text: 'Tổng các số chia hết cho 3?',
    fn: function(s) { var t=0; for (var k=0;k<s.length;k++) t+=s[k]; return t%3===0; }
  });
  qs.push({
    id: 'diff_gt5', tier: 3,
    text: 'Hiệu số lớn nhất và nhỏ nhất > 5?',
    fn: function(s) {
      var mx=s[0], mn=s[0];
      for (var k=1;k<s.length;k++){if(s[k]>mx)mx=s[k];if(s[k]<mn)mn=s[k];}
      return (mx-mn) > 5;
    }
  });

  // NHÓM 4 — Xuất hiện số cụ thể (tier 1)
  var checkNums = [0, 3, 5, 7, 9];
  for (i = 0; i < checkNums.length; i++) {
    (function(n) {
      qs.push({
        id: 'has_' + n, tier: 1,
        text: 'Dãy có chứa số ' + n + '?',
        fn: function(s) { return s.indexOf(n) !== -1; }
      });
    })(checkNums[i]);
  }

  // NHÓM 5 — Đếm (tier 2)
  qs.push({
    id: 'even_more', tier: 2,
    text: 'Có nhiều số chẵn hơn số lẻ?',
    fn: function(s) { var e=0; for (var k=0;k<s.length;k++) if(s[k]%2===0)e++; return e > s.length-e; }
  });
  qs.push({
    id: 'cnt_even_2', tier: 2,
    text: 'Có đúng 2 số chẵn?',
    fn: function(s) { var e=0; for (var k=0;k<s.length;k++) if(s[k]%2===0)e++; return e === 2; }
  });
  qs.push({
    id: 'has_dup', tier: 2,
    text: 'Có 2 số bằng nhau?',
    fn: function(s) { for (var a=0;a<s.length;a++) for (var b=a+1;b<s.length;b++) if(s[a]===s[b])return true; return false; }
  });
  qs.push({
    id: 'all_diff', tier: 2,
    text: 'Tất cả các số đều khác nhau?',
    fn: function(s) { for (var a=0;a<s.length;a++) for (var b=a+1;b<s.length;b++) if(s[a]===s[b])return false; return true; }
  });
  qs.push({
    id: 'has_big', tier: 1,
    text: 'Có ít nhất 1 số > 7?',
    fn: function(s) { for (var k=0;k<s.length;k++) if(s[k]>7)return true; return false; }
  });

  // NHÓM 6 — Trật tự (tier 2)
  qs.push({
    id: 'increasing', tier: 2,
    text: 'Dãy tăng dần?',
    fn: function(s) { for (var k=1;k<s.length;k++) if(s[k]<=s[k-1])return false; return true; }
  });
  qs.push({
    id: 'decreasing', tier: 2,
    text: 'Dãy giảm dần?',
    fn: function(s) { for (var k=1;k<s.length;k++) if(s[k]>=s[k-1])return false; return true; }
  });
  qs.push({
    id: 'max_first', tier: 2,
    text: 'Số đầu là số lớn nhất?',
    fn: function(s) { for (var k=1;k<s.length;k++) if(s[k]>s[0])return false; return true; }
  });
  qs.push({
    id: 'min_first', tier: 2,
    text: 'Số đầu là số nhỏ nhất?',
    fn: function(s) { for (var k=1;k<s.length;k++) if(s[k]<s[0])return false; return true; }
  });

  // NHÓM 7 — Vị trí đặc biệt (tier 2/3)
  qs.push({
    id: 'max_half1', tier: 3,
    text: 'Số lớn nhất ở nửa đầu dãy?',
    fn: function(s) {
      var mi=0; for (var k=1;k<s.length;k++) if(s[k]>s[mi]) mi=k;
      return mi < s.length/2;
    }
  });
  qs.push({
    id: 'min_half2', tier: 3,
    text: 'Số nhỏ nhất ở nửa sau dãy?',
    fn: function(s) {
      var mi=0; for (var k=1;k<s.length;k++) if(s[k]<s[mi]) mi=k;
      return mi >= s.length/2;
    }
  });
  qs.push({
    id: 'first_zero', tier: 2,
    text: 'Số đầu tiên là số 0?',
    fn: function(s) { return s[0] === 0; }
  });
  qs.push({
    id: 'no_zero', tier: 1,
    text: 'Dãy không có số 0?',
    fn: function(s) { return s.indexOf(0) === -1; }
  });

  // NHÓM 8 — Mẫu số (tier 3)
  qs.push({
    id: 'ap3', tier: 3,
    text: 'Có 3 số tạo cấp số cộng?',
    fn: function(s) {
      var a = s.slice().sort(function(x,y){return x-y;});
      for (var x=0;x<a.length-2;x++)
        for (var y=x+1;y<a.length-1;y++)
          for (var z=y+1;z<a.length;z++)
            if (a[y]-a[x] === a[z]-a[y] && a[z]-a[y] > 0) return true;
      return false;
    }
  });
  qs.push({
    id: 'sum_pair_10', tier: 3,
    text: 'Có 2 số cộng lại bằng 10?',
    fn: function(s) {
      for (var a=0;a<s.length;a++) for (var b=a+1;b<s.length;b++) if(s[a]+s[b]===10)return true;
      return false;
    }
  });
  qs.push({
    id: 'one_equals_sum_other', tier: 3,
    text: 'Có số nào bằng tổng 2 số còn lại?',
    fn: function(s) {
      for (var a=0;a<s.length;a++) for (var b=0;b<s.length;b++) for (var c=0;c<s.length;c++) {
        if (a!==b && b!==c && a!==c && s[a] === s[b]+s[c]) return true;
      }
      return false;
    }
  });
  qs.push({
    id: 'consec_diff1', tier: 3,
    text: 'Có 2 số chênh lệch đúng 1?',
    fn: function(s) {
      for (var a=0;a<s.length;a++) for (var b=a+1;b<s.length;b++) if(Math.abs(s[a]-s[b])===1)return true;
      return false;
    }
  });
  qs.push({
    id: 'consec_diff5', tier: 3,
    text: 'Có 2 số chênh lệch ≥ 5?',
    fn: function(s) {
      for (var a=0;a<s.length;a++) for (var b=a+1;b<s.length;b++) if(Math.abs(s[a]-s[b])>=5)return true;
      return false;
    }
  });

  // NHÓM 9 — Tính chất đặc biệt (tier 2/3)
  qs.push({
    id: 'is_prime_first', tier: 2,
    text: 'Số đầu tiên là số nguyên tố?',
    fn: function(s) { return isPrime(s[0]); }
  });
  qs.push({
    id: 'prime_more', tier: 3,
    text: 'Có nhiều số nguyên tố hơn hợp số?',
    fn: function(s) {
      var p=0, c=0;
      for (var k=0;k<s.length;k++) {
        if (isPrime(s[k])) p++;
        else if (s[k] > 1) c++;
      }
      return p > c;
    }
  });
  qs.push({
    id: 'sum_prime', tier: 3,
    text: 'Tổng các số là số nguyên tố?',
    fn: function(s) { var t=0; for (var k=0;k<s.length;k++) t+=s[k]; return isPrime(t); }
  });
  qs.push({
    id: 'prod_even', tier: 2,
    text: 'Tích 2 số đầu là số chẵn?',
    fn: function(s) { return (s[0]*s[1]) % 2 === 0; }
  });
  qs.push({
    id: 'last_div3', tier: 2,
    text: 'Số cuối chia hết cho 3?',
    fn: function(s) { return s[s.length-1] % 3 === 0; }
  });

  // NHÓM 10 — Meta-logic (tier 3)
  qs.push({
    id: 'plus1_10', tier: 3,
    text: 'Nếu cộng 1 vào mỗi số, có số bằng 10?',
    fn: function(s) { for (var k=0;k<s.length;k++) if(s[k]+1===10)return true; return false; }
  });
  qs.push({
    id: 'reverse_first_even', tier: 3,
    text: 'Nếu đảo ngược dãy, số đầu vẫn chẵn?',
    fn: function(s) { return s[s.length-1] % 2 === 0; }
  });
  qs.push({
    id: 'sort_first_orig', tier: 3,
    text: 'Nếu sắp tăng dần, số ban đầu ở vị trí 1 vẫn đứng đầu?',
    fn: function(s) {
      var m = 0;
      for (var k=1;k<s.length;k++) if(s[k] < s[m]) m = k;
      return m === 0;
    }
  });
  qs.push({
    id: 'double_lt20', tier: 1,
    text: 'Nếu nhân đôi mỗi số, tất cả đều < 20?',
    fn: function(s) { for (var k=0;k<s.length;k++) if(s[k]*2>=20)return false; return true; }
  });
  qs.push({
    id: 'abs_diff_first_gt3', tier: 3,
    text: 'Trị tuyệt đối hiệu 2 số đầu > 3?',
    fn: function(s) { return Math.abs(s[0]-s[1]) > 3; }
  });

  return qs;
}

// ============ BUILD / RENDER QUESTIONS ============
function buildQuestionsList() {
  numCount = Math.max(3, Math.min(7, parseInt(numCount, 10) || 3));
  allQuestionsCache = buildAllQuestions(numCount);

  // Shuffle
  for (var i = allQuestionsCache.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = allQuestionsCache[i];
    allQuestionsCache[i] = allQuestionsCache[j];
    allQuestionsCache[j] = tmp;
  }

  renderQuestions();
}

function renderQuestions() {
  var list = allQuestionsCache;
  if (currentFilter !== 'all') {
    var tier = currentFilter === 'tier1' ? 1 : currentFilter === 'tier2' ? 2 : 3;
    list = list.filter(function(q) { return q.tier === tier; });
  }

  els.questionsListEl.innerHTML = '';
  for (var i = 0; i < list.length; i++) {
    (function(q) {
      var btn = document.createElement('button');
      btn.className = 'q-btn';
      btn.type = 'button';
      btn.setAttribute('data-qid', q.id);

      var status = askedMap[q.id];
      if (status) {
        btn.classList.add('used', status);
      }

      // Số thứ tự (nếu đã hỏi)
      if (status && q.askOrder) {
        var numSpan = document.createElement('span');
        numSpan.className = 'q-num';
        numSpan.textContent = q.askOrder + '.';
        btn.appendChild(numSpan);
      }

      // Dot tier
      var dot = document.createElement('span');
      dot.className = 'q-dot tier' + q.tier;
      btn.appendChild(dot);

      // Text
      var txt = document.createElement('span');
      txt.className = 'q-text';
      txt.textContent = q.text;
      btn.appendChild(txt);

      // Đáp án (nếu đã hỏi)
      if (status) {
        var ansSpan = document.createElement('span');
        ansSpan.className = 'q-answer';
        ansSpan.textContent = status === 'yes' ? '= CÓ' : '= KHÔNG';
        btn.appendChild(ansSpan);
      }

      btn.onclick = function(e) {
        if (e) { e.preventDefault(); e.stopPropagation(); }
        handleQuestionClick(q, btn);
      };

      els.questionsListEl.appendChild(btn);
    })(list[i]);
  }
}

// ============ HANDLE CLICK ============
function handleQuestionClick(q, btn) {
  if (gameOver) return;
  if (questionsLeft <= 0) { showToast('Hết câu hỏi!', 'no'); return; }
  if (askedMap[q.id]) return;

  var answer = !!q.fn(secret);
  var status = answer ? 'yes' : 'no';
  askedMap[q.id] = status;
  questionCounter++;
  q.askOrder = questionCounter;

  questionsLeft--;

  // Cập nhật nút hiện tại
  btn.classList.add('used', status);
  btn.innerHTML = '';

  var numSpan = document.createElement('span');
  numSpan.className = 'q-num';
  numSpan.textContent = q.askOrder + '.';
  btn.appendChild(numSpan);

  var dot = document.createElement('span');
  dot.className = 'q-dot tier' + q.tier;
  btn.appendChild(dot);

  var txt = document.createElement('span');
  txt.className = 'q-text';
  txt.textContent = q.text;
  btn.appendChild(txt);

  var ansSpan = document.createElement('span');
  ansSpan.className = 'q-answer';
  ansSpan.textContent = answer ? '= CÓ' : '= KHÔNG';
  btn.appendChild(ansSpan);

  // Toast + sound
  showToast(answer ? 'CÓ ✓' : 'KHÔNG ✗', status);

  // HUD
  els.qLeftEl.textContent = questionsLeft;
  pulseStat(els.qStat);

  // Hết câu → mở đoán
  if (questionsLeft === 0) {
    setTimeout(openGuessPanel, 1200);
  }
}

// ============ GUESS ============
function openGuessPanel() {
  if (gameOver) return;
  currentGuess = [];
  for (var i = 0; i < numCount; i++) currentGuess.push(null);
  currentSelectedVal = null;
  renderGuessPanel();
}

function renderGuessPanel() {
  var html = '<h2>🎯 ĐOÁN DÃY SỐ</h2>';
  html += '<p>Dãy có <b>' + numCount + '</b> số (' + minVal + '–' + maxVal + '):</p>';
  html += '<div class="guess-row">';
  for (var i = 0; i < numCount; i++) {
    var val = currentGuess[i];
    html += '<div class="guess-digit" data-pos="' + i + '">';
    html += '<div class="val' + (val === null ? ' empty' : '') + '" id="gval_' + i + '">' + (val === null ? '?' : val) + '</div>';
    html += '<div class="pos">Số ' + (i+1) + '</div>';
    html += '</div>';
  }
  html += '</div>';
  html += '<div class="digit-picker">';
  for (var v = minVal; v <= maxVal; v++) {
    html += '<button class="digit-btn" data-val="' + v + '" type="button">' + v + '</button>';
  }
  html += '</div>';
  html += '<div style="font-size:10px;color:#666;margin-top:6px">👆 Chọn số, rồi chạm ô để điền</div>';
  html += '<div style="margin-top:8px">';
  html += '<button id="confirmGuess" type="button">XÁC NHẬN ✅</button>';
  html += '<button id="backToGame" type="button" class="secondary">QUAY LẠI</button>';
  html += '</div>';

  showOverlay(html);

  var digitBtns = els.overlay.querySelectorAll('.digit-btn');
  for (var d = 0; d < digitBtns.length; d++) {
    (function(b) {
      b.onclick = function() {
        var all = els.overlay.querySelectorAll('.digit-btn');
        for (var k = 0; k < all.length; k++) all[k].classList.remove('active');
        b.classList.add('active');
        currentSelectedVal = parseInt(b.getAttribute('data-val'), 10);
      };
    })(digitBtns[d]);
  }

  var cells = els.overlay.querySelectorAll('.guess-digit');
  for (var c = 0; c < cells.length; c++) {
    (function(cell, idx) {
      cell.onclick = function() {
        if (currentSelectedVal === null) { showToast('Chọn số trước!', 'no'); return; }
        currentGuess[idx] = currentSelectedVal;
        var vd = document.getElementById('gval_' + idx);
        vd.textContent = currentSelectedVal;
        vd.classList.remove('empty');
      };
    })(cells[c], c);
  }

  document.getElementById('confirmGuess').onclick = function() {
    for (var i = 0; i < numCount; i++) {
      if (currentGuess[i] === null) { showToast('Chọn đủ ' + numCount + ' số!', 'no'); return; }
    }
    checkGuess();
  };
  document.getElementById('backToGame').onclick = hideOverlay;
}

// ============ CHECK ============
function checkGuess() {
  var correct = true;
  for (var i = 0; i < numCount; i++) {
    if (currentGuess[i] !== secret[i]) { correct = false; break; }
  }

  gameOver = true;
  var questionsUsed = questionsTotal - questionsLeft;
  var points = 0;

  if (correct) {
    if (questionsUsed <= 2) points = 100;
    else if (questionsUsed === 3) points = 70;
    else if (questionsUsed === 4) points = 50;
    else if (questionsUsed === 5) points = 35;
    else if (questionsUsed === 6) points = 25;
    else points = 15;

    points += (numCount - 3) * 25;
    var modeBonus = { easy: 0, normal: 15, hard: 35 };
    points += modeBonus[currentMode] || 0;

    streak++;
    if (streak >= 3) points = Math.floor(points * 1.5);
  } else {
    streak = 0;
  }

  totalScore += points;
  els.scoreTotalEl.textContent = totalScore;
  try { localStorage.setItem('turingCrayonScore', totalScore); } catch(e) {}

  if (correct) saveToLB(points);
  showResult(correct, points, questionsUsed);
}

function saveToLB(points) {
  try {
    var lb = JSON.parse(localStorage.getItem('turingCrayonLB') || '[]');
    lb.push({ name: playerName, score: points, level: level, mode: currentMode, date: Date.now() });
    lb.sort(function(a, b) { return b.score - a.score; });
    lb = lb.slice(0, 10);
    localStorage.setItem('turingCrayonLB', JSON.stringify(lb));
  } catch(e) {}
}

// ============ RESULT ============
function showResult(correct, points, questionsUsed) {
  var html = '';
  if (correct) {
    html += '<h2 class="win">🎉 PHÁ MÃ THÀNH CÔNG!</h2>';
    html += '<p>Sau <b>' + questionsUsed + '</b> câu hỏi, bạn đã tìm ra:</p>';
  } else {
    html += '<h2>😅 CHƯA ĐÚNG</h2>';
    html += '<p>Dãy đúng là:</p>';
  }

  html += '<div class="secret-reveal">';
  for (var i = 0; i < secret.length; i++) {
    html += '<div class="secret-num">' + secret[i] + '</div>';
  }
  html += '</div>';

  if (correct) {
    html += '<p>+<b>' + points + '</b> điểm' + (streak > 1 ? ' 🔥 Chuỗi ' + streak : '') + '</p>';
    html += '<button id="nextLvBtn" type="button" class="tertiary">LEVEL TIẾP ▶</button>';
    html += '<button id="againBtn" type="button" class="secondary">CHƠI LẠI</button>';
  } else {
    html += '<p>Bạn đoán: ' + currentGuess.slice(0, numCount).join(' - ') + '</p>';
    html += '<button id="againBtn" type="button">THỬ LẠI 🔁</button>';
    html += '<button id="changeModeBtn" type="button" class="secondary">Đổi chế độ</button>';
  }

  var lb = [];
  try { lb = JSON.parse(localStorage.getItem('turingCrayonLB') || '[]'); } catch(e) {}
  if (lb.length > 0) {
    html += '<div class="leaderboard"><h3>🏆 TOP 10</h3>';
    for (var k = 0; k < Math.min(lb.length, 10); k++) {
      var medal = k===0?'🥇':k===1?'🥈':k===2?'🥉':(k+1)+'.';
      html += '<div class="lb-row"><span class="rank">'+medal+'</span><span class="name">'+escapeHtml(lb[k].name)+'</span><span class="pts">'+lb[k].score+'</span></div>';
    }
    html += '</div>';
  }

  showOverlay(html);

  if (correct) {
    document.getElementById('nextLvBtn').onclick = function() {
      level++;
      els.levelStatEl.textContent = level;
      startGame();
    };
    document.getElementById('againBtn').onclick = function() { startGame(); };
  } else {
    document.getElementById('againBtn').onclick = function() { startGame(); };
    document.getElementById('changeModeBtn').onclick = function() { level = 1; showModeSelect(); };
  }
}

// ============ UTILS ============
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

})();
</script>
