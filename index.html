<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎮 Game Hub Crayon</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body {
    margin:0; padding:0; width:100%; height:100%;
    overflow:hidden; background:#fdf6e3;
    font-family:'Comic Sans MS','Chalkboard SE',cursive;
    touch-action:manipulation;
  }
  #app {
    width:100%; height:100%;
    display:flex; flex-direction:column;
    padding:4px; gap:3px;
    max-width:520px; margin:0 auto;
  }

  /* MENU */
  #menuView {
    flex:1;
    display:flex; flex-direction:column;
    overflow-y:auto;
    padding:6px;
    gap:8px;
    -webkit-overflow-scrolling:touch;
  }
  #menuTitle {
    text-align:center;
    font-size:clamp(20px,6vw,26px);
    color:#2d3142;
    text-shadow:3px 3px 0 #ffd166, -1px -1px 0 #ef476f;
    margin:6px 0;
    transform:rotate(-1deg);
  }
  #menuSubtitle {
    text-align:center;
    font-size:clamp(11px,3vw,13px);
    color:#666;
    font-style:italic;
    margin-bottom:6px;
  }
  .game-card {
    background:#fffef8;
    border:3px solid #2d3142;
    border-radius:14px 5px 16px 7px / 7px 16px 5px 14px;
    padding:12px 14px;
    box-shadow:3px 3px 0 rgba(45,49,66,0.35);
    cursor:pointer;
    transition:all 0.15s;
    display:flex; align-items:center; gap:12px;
    flex-shrink:0;
  }
  .game-card:active {
    transform:translate(2px,2px);
    box-shadow:1px 1px 0 rgba(45,49,66,0.35);
  }
  .game-card .icon {
    font-size:clamp(28px,8vw,36px);
    flex-shrink:0;
    width:50px; text-align:center;
  }
  .game-card .info { flex:1; min-width:0; }
  .game-card .name {
    font-size:clamp(14px,4vw,17px);
    font-weight:bold;
    color:#2d3142;
    margin-bottom:2px;
  }
  .game-card .desc {
    font-size:clamp(10px,2.9vw,12px);
    color:#666;
    margin-bottom:4px;
  }
  .game-card .stats {
    display:flex; gap:10px;
    font-size:clamp(10px,2.8vw,11px);
  }
  .game-card .stats .high { color:#ef476f; font-weight:bold; }
  .game-card .stats .total { color:#118ab2; font-weight:bold; }

  .game-card.math { background:linear-gradient(135deg,#fffef8,#fff8e7); }
  .game-card.mm { background:linear-gradient(135deg,#fffef8,#e8f4ff); }
  .game-card.story { background:linear-gradient(135deg,#fffef8,#f0fdf8); }

  /* GAME VIEW */
  #gameView {
    flex:1; min-height:0;
    display:none;
    flex-direction:column;
    gap:3px;
  }
  #gameView.show { display:flex; }

  header {
    flex-shrink:0;
    display:flex; align-items:center; gap:6px;
    padding:1px 0;
  }
  #backBtn {
    background:#fff;
    border:2.5px solid #2d3142;
    border-radius:10px;
    width:36px; height:36px;
    font-size:18px; font-weight:bold;
    color:#2d3142;
    cursor:pointer;
    box-shadow:2px 2px 0 rgba(45,49,66,0.35);
    flex-shrink:0;
    padding:0;
    -webkit-appearance:none;
  }
  #backBtn:active { transform:translate(1px,1px); box-shadow:1px 1px 0 rgba(45,49,66,0.35); }
  #gameTitle {
    flex:1;
    margin:0;
    font-size:clamp(14px,4vw,18px);
    color:#2d3142;
    text-align:center;
    text-shadow:2px 2px 0 #ffd166;
    transform:rotate(-0.5deg);
  }
  #titleSpacer { width:36px; flex-shrink:0; }

  #hud {
    display:flex; justify-content:center; gap:3px;
    flex-shrink:0; flex-wrap:wrap;
  }
  .stat {
    background:#fff;
    border:2px solid #2d3142;
    border-radius:10px 4px 12px 5px / 5px 12px 4px 10px;
    padding:2px 6px;
    font-size:clamp(9px,2.7vw,11px);
    color:#2d3142; font-weight:bold;
    box-shadow:2px 2px 0 rgba(45,49,66,0.35);
    white-space:nowrap;
    display:flex; align-items:center; gap:2px;
    max-width: 100%;
  }
  .stat span { color:#ef476f; }
  .stat.player { background:#e8f4ff; }
  .stat.player span { color:#118ab2; max-width:60px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:inline-block; vertical-align:bottom; }
  .stat:nth-child(2) span { color:#06d6a0; }
  .stat.high { background:#fff8e7; }
  .stat.high span { color:#ff9a3c; }
  .stat.pulse { animation:pulseStat 0.35s; }
  @keyframes pulseStat {
    0%,100% { transform:scale(1); }
    50% { transform:scale(1.18); background:#ffd166; }
  }

  #gameContent {
    flex:1; min-height:0;
    display:flex; flex-direction:column;
    gap:3px;
    overflow:hidden;
  }

  .panel {
    background:#fffef8;
    border:2.5px solid #2d3142;
    border-radius:11px 4px 13px 6px / 6px 13px 4px 11px;
    box-shadow:2px 2px 0 rgba(45,49,66,0.3);
    padding:6px 8px;
    display:flex; flex-direction:column;
    overflow:hidden;
  }
  .panel-title {
    flex-shrink:0;
    font-size:clamp(10px,2.8vw,12px);
    color:#2d3142; font-weight:bold;
    border-bottom:2px dashed #ffd166;
    padding-bottom:3px;
    margin-bottom:4px;
    display:flex; justify-content:space-between; align-items:center;
  }
  .panel-title small { color:#666; font-weight:normal; font-size:0.85em; }

  #mainPanel { flex:1; min-height:0; }
  #mainList {
    flex:1; overflow-y:auto;
    display:flex; flex-direction:column; gap:4px;
    -webkit-overflow-scrolling:touch;
    padding-right:2px;
  }

  /* Math equation */
  .equation {
    padding:8px 10px;
    background:linear-gradient(135deg, #fff8e7, #fffef8);
    border:2px solid #ffd166;
    border-radius:9px 4px 9px 4px / 4px 9px 4px 9px;
    font-size:clamp(11px,3.2vw,14px);
    font-weight:bold;
    color:#2d3142;
    text-align:center;
    box-shadow:1.5px 1.5px 0 rgba(45,49,66,0.2);
    flex-shrink:0;
    line-height:1.4;
  }
  .equation.hard {
    border-color:#ef476f;
    background:linear-gradient(135deg, #ffe4e6, #fffef8);
  }
  .equation .eq-num {
    display:inline-block;
    background:#118ab2;
    color:#fff;
    font-size:0.75em;
    padding:1px 6px;
    border-radius:5px;
    margin-right:5px;
    vertical-align:middle;
  }
  .equation.hard .eq-num { background:#ef476f; }

  /* Mastermind history */
  .mm-history {
    padding:6px 8px;
    background:#fff;
    border:1.5px solid #2d3142;
    border-radius:8px;
    display:flex; align-items:center; gap:6px;
    flex-shrink:0;
    animation:slideIn 0.25s;
  }
  @keyframes slideIn { from{opacity:0;transform:translateY(-6px)} to{opacity:1;transform:translateY(0)} }
  .mm-history.win { background:#d4f8e4; border-color:#06d6a0; }
  .mm-num {
    font-size:clamp(9px,2.6vw,11px);
    color:#888; font-weight:bold;
    min-width:18px;
  }
  .mm-guess {
    display:flex; gap:3px;
  }
  .mm-digit {
    display:inline-flex;
    align-items:center; justify-content:center;
    width:clamp(20px,5.5vw,24px);
    height:clamp(20px,5.5vw,24px);
    background:#e8f4ff;
    border:1.5px solid #2d3142;
    border-radius:5px;
    font-family:inherit;
    font-size:clamp(11px,3vw,13px);
    font-weight:bold;
    color:#2d3142;
  }
  
  /* FIX LỖI HIỂU LẦM MASTERMIND: Dùng dạng đếm số lượng */
  .mm-feedback {
    margin-left:auto;
    display:flex; gap:4px; align-items:center;
    font-family:sans-serif;
    font-size:clamp(10px,2.8vw,12px);
    font-weight:bold;
  }
  .fb-count {
    padding: 2px 5px;
    border-radius: 5px;
    border: 1.5px solid #2d3142;
    display:flex; align-items:center; gap:2px;
  }
  .fb-count.exact { background:#06d6a0; color:#fff; }
  .fb-count.color { background:#ffd166; color:#2d3142; }
  .fb-count.wrong { background:#e0e0e0; color:#666; }
  
  .mm-empty {
    text-align:center; color:#999; font-style:italic;
    font-size:clamp(10px,2.8vw,12px); padding:12px;
  }

  /* Story */
  .story-card {
    padding:10px 12px;
    background:linear-gradient(135deg, #fff8e7, #f0fdf8);
    border:2px solid #ffd166;
    border-radius:9px 4px 9px 4px / 4px 9px 4px 9px;
    font-size:clamp(11px,3.2vw,14px);
    color:#2d3142;
    line-height:1.55;
    flex-shrink:0;
  }
  .story-card .story-title {
    font-weight:bold;
    color:#ef476f;
    margin-bottom:5px;
    font-size:clamp(12px,3.4vw,15px);
    text-align:center;
    padding-bottom:4px;
    border-bottom:1.5px dashed #ffd166;
  }
  .story-card .story-text { text-align:justify; }

  /* Hint display */
  #hintDisplay {
    flex-shrink:0;
    text-align:center;
    font-size:clamp(10px,2.8vw,12px);
    color:#118ab2;
    font-weight:bold;
    padding:3px 6px;
    background:#e8f4ff;
    border:1.5px dashed #118ab2;
    border-radius:7px;
    display:none;
  }
  #hintDisplay.show { display:block; }

  /* Input */
  #inputPanel {
    flex-shrink:0;
    background:linear-gradient(135deg, #fffef8, #fff8e7);
    border:3px solid #2d3142;
    border-radius:14px 5px 16px 7px / 7px 16px 5px 14px;
    box-shadow:3px 3px 0 rgba(45,49,66,0.35);
    padding:6px 8px;
  }
  #inputTitle {
    text-align:center;
    font-size:clamp(10px,2.8vw,12px);
    color:#2d3142;
    font-weight:bold;
    margin-bottom:4px;
  }
  #inputRow {
    display:flex;
    justify-content:center;
    gap:5px;
    flex-wrap:wrap;
  }
  .input-slot {
    display:flex; flex-direction:column;
    align-items:center;
    gap:2px;
  }
  .slot-label {
    font-size:clamp(7px,2vw,9px);
    color:#888;
    font-family:sans-serif;
    font-weight:bold;
    text-align:center;
    max-width:48px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .slot-input {
    width:clamp(34px,9vw,42px);
    height:clamp(38px,10vw,46px);
    background:#fffef8;
    border:2.5px solid #2d3142;
    border-radius:9px 4px 9px 4px / 4px 9px 4px 9px;
    text-align:center;
    font-family:'Comic Sans MS', cursive;
    font-size:clamp(17px,5.2vw,21px);
    font-weight:bold;
    color:#2d3142;
    -webkit-appearance:none;
    outline:none;
    box-shadow:2px 2px 0 rgba(45,49,66,0.3);
    padding:0;
  }
  .slot-input:focus {
    border-color:#ef476f;
    box-shadow:0 0 0 2px rgba(239,71,111,0.2);
  }
  .slot-input.filled {
    border-color:#06d6a0;
    background:#d4f8e4;
  }
  .slot-input.revealed {
    border-color:#118ab2;
    background:#e8f4ff;
    color:#118ab2;
    cursor:not-allowed;
  }

  #actionRow {
    flex-shrink:0;
    display:flex;
    gap:5px;
  }
  #submitBtn {
    flex:2;
    padding:9px;
    background:#ef476f;
    color:#fff;
    border:3px solid #2d3142;
    border-radius:12px 4px 14px 6px / 6px 14px 4px 12px;
    font-family:inherit;
    font-weight:bold;
    font-size:clamp(12px,3.3vw,14px);
    cursor:pointer;
    box-shadow:2.5px 2.5px 0 #2d3142;
    -webkit-appearance:none;
    letter-spacing:0.5px;
  }
  #submitBtn:active { transform:translate(1.5px,1.5px); box-shadow:1px 1px 0 #2d3142; }
  #submitBtn:disabled { background:#ccc; color:#666; cursor:not-allowed; box-shadow:2px 2px 0 #999; }
  #hintBtn {
    flex:1;
    padding:9px;
    background:#118ab2;
    color:#fff;
    border:3px solid #2d3142;
    border-radius:12px 4px 14px 6px / 6px 14px 4px 12px;
    font-family:inherit;
    font-weight:bold;
    font-size:clamp(11px,3vw,13px);
    cursor:pointer;
    box-shadow:2.5px 2.5px 0 #2d3142;
    -webkit-appearance:none;
  }
  #hintBtn:active { transform:translate(1.5px,1.5px); box-shadow:1px 1px 0 #2d3142; }
  #hintBtn:disabled { background:#ccc; color:#666; cursor:not-allowed; box-shadow:2px 2px 0 #999; }

  /* Toast */
  #toast {
    position:fixed; top:50%; left:50%;
    transform:translate(-50%, -50%) scale(0.3);
    background:#fff;
    border:4px solid #2d3142;
    border-radius:18px;
    padding:14px 30px;
    font-family:'Comic Sans MS', cursive;
    font-size:clamp(22px,6.5vw,30px);
    font-weight:bold;
    box-shadow:5px 5px 0 rgba(45,49,66,0.5);
    z-index:1000;
    pointer-events:none;
    opacity:0;
    transition:all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  #toast.show { opacity:1; transform:translate(-50%, -50%) scale(1); }
  #toast.yes { background:#06d6a0; color:#fff; }
  #toast.no { background:#ef476f; color:#fff; }
  #toast.info { background:#118ab2; color:#fff; font-size:clamp(14px,4.5vw,20px); }
  #toast.record { background:#ffd166; color:#2d3142; font-size:clamp(16px,5vw,22px); }

  /* Overlay */
  #overlay {
    position:fixed; inset:0;
    background:rgba(253, 246, 227, 0.97);
    display:flex; flex-direction:column;
    justify-content:center; align-items:center;
    text-align:center; padding:16px;
    z-index:100;
    overflow-y:auto;
  }
  #overlay.hidden { display:none; }
  #overlay h2 {
    font-size:clamp(18px,5.5vw,26px);
    color:#ef476f;
    margin:0 0 8px;
    text-shadow:2px 2px 0 #ffd166;
    transform:rotate(-2deg);
  }
  #overlay h2.win { color:#06d6a0; }
  #overlay p {
    font-size:clamp(11px,3.2vw,14px);
    color:#2d3142;
    margin:4px 0;
    line-height:1.4;
    max-width:340px;
  }
  #overlay b { color:#06d6a0; }
  .secret-reveal {
    display:flex; gap:5px; margin:8px 0;
    justify-content:center; flex-wrap:wrap;
  }
  .secret-item {
    display:flex; flex-direction:column; align-items:center; gap:2px;
  }
  .secret-label {
    font-size:clamp(8px,2.4vw,10px);
    color:#666;
    font-family:sans-serif;
    font-weight:bold;
    max-width:50px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .secret-num {
    width:38px; height:38px;
    background:#ffd166;
    border:3px solid #2d3142;
    border-radius:10px 3px 10px 3px / 3px 10px 3px 10px;
    display:flex; align-items:center; justify-content:center;
    font-size:18px; font-weight:bold; color:#2d3142;
    box-shadow:2px 2px 0 rgba(45,49,66,0.4);
  }
  #overlay button {
    margin-top:8px;
    padding:10px 24px;
    font-size:clamp(12px,3.6vw,15px);
    font-weight:bold;
    font-family:inherit;
    color:#fff;
    background:#ef476f;
    border:3px solid #2d3142;
    border-radius:12px 4px 14px 6px / 6px 14px 4px 12px;
    box-shadow:2.5px 2.5px 0 #2d3142;
    cursor:pointer;
    -webkit-appearance:none;
  }
  #overlay button:active { transform:translate(1.5px,1.5px); box-shadow:1px 1px 0 #2d3142; }
  #overlay button.secondary { background:#118ab2; margin-left:5px; }
  #overlay button.tertiary { background:#06d6a0; }

  .name-input {
    padding:9px 12px;
    font-size:14px;
    font-family:inherit;
    border:2.5px solid #2d3142;
    border-radius:11px;
    background:#fff;
    text-align:center;
    width:200px; max-width:85%;
    color:#2d3142;
    outline:none;
    margin:5px 0;
  }
  .name-input:focus { border-color:#ef476f; box-shadow:0 0 0 3px rgba(239,71,111,0.2); }

  .rules-box {
    background:#fff8e7;
    border:2px dashed #ffd166;
    border-radius:10px;
    padding:10px 14px;
    margin:8px 0;
    max-width:340px;
    font-size:clamp(11px,3.1vw,13px);
    color:#2d3142;
    text-align:left;
    line-height:1.5;
  }
  .rules-box b { color:#118ab2; }
  .rules-box .exact { color:#06d6a0; font-weight:bold; }
  .rules-box .color { color:#ff9a3c; font-weight:bold; }
  .rules-box .wrong { color:#888; font-weight:bold; }

  .leaderboard {
    width:100%; max-width:340px;
    margin:8px auto;
    background:#fff;
    border:2.5px solid #2d3142;
    border-radius:11px;
    padding:6px 9px;
    text-align:left;
  }
  .leaderboard h3 {
    margin:0 0 5px;
    font-size:12px; color:#2d3142; text-align:center;
    border-bottom:2px dashed #ffd166; padding-bottom:3px;
  }
  .lb-row {
    display:flex; justify-content:space-between;
    padding:2px 3px; font-size:11px; color:#2d3142; border-radius:4px;
  }
  .lb-row:first-child { background:#ffd166; font-weight:bold; }
  .lb-row .rank { width:20px; }
  .lb-row .name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lb-row .pts { color:#ef476f; font-weight:bold; }

  .record-banner {
    background:linear-gradient(135deg, #ffd166, #ff9a3c);
    border:3px solid #2d3142;
    border-radius:11px;
    padding:8px 14px;
    margin:6px 0;
    font-size:clamp(12px,3.4vw,15px);
    font-weight:bold;
    color:#2d3142;
    box-shadow:2px 2px 0 rgba(45,49,66,0.4);
    animation:bounceRecord 0.6s ease-out;
  }
  @keyframes bounceRecord {
    0% { transform:scale(0.3); opacity:0; }
    60% { transform:scale(1.1); opacity:1; }
    100% { transform:scale(1); }
  }

  .hidden { display:none !important; }
</style>
</head>
<body>

<div id="app">

  <!-- MENU -->
  <div id="menuView">
    <div id="menuTitle">🎮 GAME HUB CRAYON</div>
    <div id="menuSubtitle">Chọn 1 game để chơi</div>

    <div class="game-card math" data-game="math">
      <div class="icon">🧮</div>
      <div class="info">
        <div class="name">Math Puzzle</div>
        <div class="desc">Giải phương trình tìm dãy số</div>
        <div class="stats">
          <span class="high">🏆 High: <span data-high="math">0</span></span>
          <span class="total">💰 Total: <span data-total="math">0</span></span>
        </div>
      </div>
    </div>

    <div class="game-card mm" data-game="mastermind">
      <div class="icon">🎯</div>
      <div class="info">
        <div class="name">Mastermind</div>
        <div class="desc">Đoán mã bằng phản hồi trực quan</div>
        <div class="stats">
          <span class="high">🏆 High: <span data-high="mastermind">0</span></span>
          <span class="total">💰 Total: <span data-total="mastermind">0</span></span>
        </div>
      </div>
    </div>

    <div class="game-card story" data-game="story">
      <div class="icon">📖</div>
      <div class="info">
        <div class="name">Story Mode</div>
        <div class="desc">Đọc truyện, tìm manh mối (Khó)</div>
        <div class="stats">
          <span class="high">🏆 High: <span data-high="story">0</span></span>
          <span class="total">💰 Total: <span data-total="story">0</span></span>
        </div>
      </div>
    </div>
  </div>

  <!-- GAME VIEW -->
  <div id="gameView">
    <header>
      <button id="backBtn" type="button">←</button>
      <h1 id="gameTitle"></h1>
      <div id="titleSpacer"></div>
    </header>

    <div id="hud">
      <div class="stat player">👤 <span id="playerNameDisplay">Ẩn danh</span></div>
      <div class="stat" id="lvStat">Lv <span id="levelStat">1</span></div>
      <div class="stat" id="attemptStat">Lượt <span id="attemptLeft">3</span></div>
      <div class="stat high" id="highStat">🏆 <span id="highScore">0</span></div>
      <div class="stat" id="scStat">💰 <span id="scoreTotal">0</span></div>
    </div>

    <div id="gameContent">
      <div class="panel" id="mainPanel">
        <div class="panel-title">
          <span id="mainPanelTitle">📐</span>
          <small id="mainPanelSub"></small>
        </div>
        <div id="mainList"></div>
      </div>

var storyDeck = [];

// ============ GLOBAL STATE ============
var currentGame = null;
var playerName = 'Người chơi';

// Per-game state
var games = {
  math:       { level: 1, total: 0, high: 0, secret: [], attempts: 0, maxAttempts: 3, hintUsed: false, revealed: {}, currentGuess: [], equations: [], gameOver: false },
  mastermind: { level: 1, total: 0, high: 0, secret: [], attempts: 0, maxAttempts: 8, hintsUsed: 0, maxHints: 2, revealed: {}, currentGuess: [], history: [], gameOver: false },
  story:      { level: 1, total: 0, high: 0, secret: [], attempts: 0, maxAttempts: 3, hintUsed: false, revealed: {}, currentGuess: [], storyIdx: 0, gameOver: false }
};

// ============ LS HELPERS ============
function lsGet(k, d) { try { var v = localStorage.getItem(k); return v !== null ? v : d; } catch(e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, String(v)); } catch(e) {} }
function lsGetNum(k, d) { var n = parseInt(lsGet(k, String(d)), 10); return isNaN(n) ? d : n; }
function loadGameStats(g) {
  games[g].total = lsGetNum('hub_' + g + '_total', 0);
  games[g].high = lsGetNum('hub_' + g + '_high', 0);
}
function saveGameStats(g) {
  lsSet('hub_' + g + '_total', games[g].total);
  lsSet('hub_' + g + '_high', games[g].high);
}
function getLB(g) { try { return JSON.parse(lsGet('hub_' + g + '_lb', '[]')); } catch(e) { return []; } }
function saveLBTo(g, lb) { lsSet('hub_' + g + '_lb', JSON.stringify(lb)); }

// ============ DOM REFS ============
var els = {};

// ============ READY ============
function ready(fn) {
  if (document.readyState !== 'loading') fn();
  else document.addEventListener('DOMContentLoaded', fn);
}

ready(function() {
  els.menuView = document.getElementById('menuView');
  els.gameView = document.getElementById('gameView');
  els.gameTitle = document.getElementById('gameTitle');
  els.backBtn = document.getElementById('backBtn');
  els.playerNameDisplay = document.getElementById('playerNameDisplay');
  els.levelStatEl = document.getElementById('levelStat');
  els.attemptLeftEl = document.getElementById('attemptLeft');
  els.attemptStatEl = document.getElementById('attemptStat');
  els.scStatEl = document.getElementById('scStat');
  els.highStatEl = document.getElementById('highStat');
  els.highScoreEl = document.getElementById('highScore');
  els.scoreTotalEl = document.getElementById('scoreTotal');
  els.mainPanelTitle = document.getElementById('mainPanelTitle');
  els.mainPanelSub = document.getElementById('mainPanelSub');
  els.mainListEl = document.getElementById('mainList');

  els.inputTitleEl = document.getElementById('inputTitle');
  els.hintDisplayEl = document.getElementById('hintDisplay');
  els.submitBtn = document.getElementById('submitBtn');
  els.hintBtn = document.getElementById('hintBtn');
  els.toast = document.getElementById('toast');
  els.overlay = document.getElementById('overlay');

  for (var g in games) loadGameStats(g);
  playerName = lsGet('hub_playerName', 'Người chơi');
  els.playerNameDisplay.textContent = playerName;

  var cards = document.querySelectorAll('.game-card');
  for (var i = 0; i < cards.length; i++) {
    (function(card) {
      card.addEventListener('click', function() {
        var game = card.getAttribute('data-game');
        selectGame(game);
      });
    })(cards[i]);
  }

  els.backBtn.onclick = backToMenu;
  els.submitBtn.onclick = submitGuess;
  els.hintBtn.onclick = applyHint;

});

// ============ MENU DISPLAY ============
function updateMenuDisplay() {
  for (var g in games) {
    var highEl = document.querySelector('[data-high="' + g + '"]');
    var totalEl = document.querySelector('[data-total="' + g + '"]');
    if (highEl) highEl.textContent = games[g].high;
    if (totalEl) totalEl.textContent = games[g].total;
  }
}

// ============ TOAST ============
var toastTimer = null;
function showToast(text, type) {
  els.toast.textContent = text;
  els.toast.className = 'show ' + (type || 'info');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { els.toast.className = ''; }, 1200);
  try { if (navigator.vibrate) navigator.vibrate(type === 'yes' ? 25 : (type === 'no' ? [25,35,25] : 15)); } catch(e) {}
  playBeep(type === 'yes');
}

// ============ SOUND ============
var audioCtx = null;
function playBeep(high) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    var now = audioCtx.currentTime;
    osc.type = 'sine';
    osc.frequency.setValueAtTime(high ? 880 : 440, now);
    osc.frequency.exponentialRampToValueAtTime(high ? 1100 : 300, now + 0.1);
    gain.gain.setValueAtTime(0.08, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
    osc.start(now); osc.stop(now + 0.15);
  } catch(e) {}
}

function pulseStat(el) {
  if (!el) return;
  el.classList.remove('pulse');
  void el.offsetWidth;
  el.classList.add('pulse');
}

// ============ OVERLAY ============
function showOverlay(html) {
  els.overlay.innerHTML = html;
  els.overlay.classList.remove('hidden');
}
function hideOverlay() { els.overlay.classList.add('hidden'); }

// ============ MENU -> GAME ============
function selectGame(game) {
  currentGame = game;
  var info = GAME_INFO[game];
  els.menuView.classList.add('hidden');
  els.gameView.classList.add('show');
  els.gameTitle.textContent = info.title;
  els.submitBtn.textContent = info.submitLabel;

  var g = games[game];
  els.levelStatEl.textContent = g.level;
  els.highScoreEl.textContent = g.high;
  els.scoreTotalEl.textContent = g.total;
  els.playerNameDisplay.textContent = playerName;

  showNamePrompt();
}

function backToMenu() {
  if (currentGame) saveGameStats(currentGame);
  currentGame = null;
  els.gameView.classList.remove('show');
  els.menuView.classList.remove('hidden');
  updateMenuDisplay();
  hideOverlay();
}

// ============ NAME PROMPT ============
function showNamePrompt() {
  var html = '<h2>' + GAME_INFO[currentGame].icon + ' ' + GAME_INFO[currentGame].title + '</h2>';
  html += '<p>Tên của bạn:</p>';
  html += '<input id="nameInput" class="name-input" type="text" maxlength="16" placeholder="Nhập tên..." value="' + escapeHtml(playerName) + '">';
  html += '<div class="rules-box">' + getRulesHTML(currentGame) + '</div>';
  html += '<button id="goBtn" type="button">BẮT ĐẦU 🖍️</button>';
  showOverlay(html);

  document.getElementById('goBtn').onclick = function() {
    var input = document.getElementById('nameInput');
    var name = (input.value || '').trim() || 'Ẩn danh';
    if (name.length > 16) name = name.slice(0, 16);
    playerName = name;
    lsSet('hub_playerName', name);
    els.playerNameDisplay.textContent = playerName;
    
    games[currentGame].level = 1;
    // Reset story deck khi vào game mới
    if (currentGame === 'story') storyDeck = []; 
    prepareGame(currentGame);
  };
}

function getRulesHTML(game) {
  if (game === 'math') {
    return '<b>📖 LUẬT CHƠI:</b><br>' +
           '• Tìm dãy <b>3-5 số</b> (0-9) từ các phương trình.<br>' +
           '• PT gồm: cộng, trừ, nhân, chia, bình phương, hỗn hợp.<br>' +
           '• Có <b>3 lần</b> kiểm tra. Đúng lần 1 → điểm cao.<br>' +
           '• <b>1 hint</b> (-10đ) để lộ 1 vị trí.';
  }
  if (game === 'mastermind') {
    return '<b>📖 LUẬT CHƠI:</b><br>' +
           '• Đoán dãy <b>3-5 số</b> (0-9), có thể trùng.<br>' +
           '• Phản hồi bên phải là <b>SỐ LƯỢNG</b> (không phải vị trí):<br>' +
           '&nbsp;&nbsp;<span class="exact">1 ✓</span> = 1 số đúng vị trí<br>' +
           '&nbsp;&nbsp;<span class="color">1 ◐</span> = 1 số đúng nhưng sai vị trí<br>' +
           '&nbsp;&nbsp;<span class="wrong">1 ✕</span> = 1 số không có trong dãy.<br>' +
           '• Có <b>8 lượt</b>. <b>2 hint</b> (mỗi hint -10đ).';
  }
  if (game === 'story') {
    return '<b>📖 LUẬT CHƠI:</b><br>' +
           '• Đọc truyện, suy luận tìm dãy số.<br>' +
           '• Chú ý tên nhân vật dưới các ô nhập liệu.<br>' +
           '• Có <b>3 lần</b> trả lời. Đúng lần 1 → điểm cao.<br>' +
           '• <b>1 hint</b> (-10đ) để lộ 1 vị trí.<br>' +
           '• Các câu chuyện được xáo trộn ngẫu nhiên.';
  }
  return '';
}

// ============ STORY LOGIC ============
function getNextStoryIndex() {
  if (storyDeck.length === 0) {
    storyDeck = [];
    for (var i = 0; i < STORIES.length; i++) storyDeck.push(i);
    // Xáo trộn mảng
    for (var j = storyDeck.length - 1; j > 0; j--) {
      var k = Math.floor(Math.random() * (j + 1));
      var tmp = storyDeck[j]; storyDeck[j] = storyDeck[k]; storyDeck[k] = tmp;
    }
  }
  return storyDeck.pop();
}

// ============ PREPARE GAME ============
function prepareGame(game) {
  var g = games[game];
  g.attempts = 0;
  g.hintUsed = false;
  g.hintsUsed = 0;
  g.revealed = {};
  g.currentGuess = [];
  g.history = [];
  g.gameOver = false;
  g.secret = [];

  if (game === 'math') {
    var cfg = getLevelConfig(game, g.level);
    g.maxAttempts = 3;
    for (var i = 0; i < cfg.nums; i++) {
      g.secret.push(Math.floor(Math.random() * 10));
      g.currentGuess.push(null);
    }
    g.equations = buildMathPuzzle(g.secret);
  } else if (game === 'mastermind') {
    var cfg2 = getLevelConfig(game, g.level);
    g.maxAttempts = 8;
    for (var j = 0; j < cfg2.nums; j++) {
      g.secret.push(Math.floor(Math.random() * 10));
      g.currentGuess.push(null);
    }
  } else if (game === 'story') {
    var storyIdx = getNextStoryIndex(); // Lấy ngẫu nhiên từ Deck
    g.storyIdx = storyIdx;
    var story = STORIES[storyIdx];
    g.secret = story.answer.slice();
    g.maxAttempts = 3;
    for (var k = 0; k < g.secret.length; k++) {
      g.currentGuess.push(null);
    }
  }

  els.levelStatEl.textContent = g.level;
  els.highScoreEl.textContent = g.high;
  els.scoreTotalEl.textContent = g.total;
  els.submitBtn.disabled = false;
  els.hintBtn.disabled = false;
  els.hintDisplayEl.classList.remove('show');
  els.hintDisplayEl.textContent = '';

  renderGame();
  updateHUD();
  hideOverlay();
}

function getLevelConfig(game, lv) {
  lv = Math.max(1, parseInt(lv, 10) || 1);
  var nums;
  if (game === 'math') {
    nums = Math.min(5, 3 + Math.floor((lv - 1) / 2));
  } else if (game === 'mastermind') {
    nums = Math.min(5, 3 + Math.floor((lv - 1) / 2));
  } else {
    nums = 3;
  }
  return { nums: nums };
}

// ============ RENDER GAME ============
function renderGame() {
  if (currentGame === 'math') renderMath();
  else if (currentGame === 'mastermind') renderMastermind();
  else if (currentGame === 'story') renderStory();

  renderInput();
  renderHint();
}

function renderMath() {
  var g = games.math;
  els.mainPanelTitle.textContent = '📐 Phương trình gợi ý';
  els.mainPanelSub.textContent = g.equations.length + ' PT';

  var html = '';
  for (var i = 0; i < g.equations.length; i++) {
    var eq = g.equations[i];
    html += '<div class="equation' + (eq.hard ? ' hard' : '') + '">';
    html += '<span class="eq-num">' + (i+1) + '</span>';
    html += escapeHtml(eq.text);
    html += '</div>';
  }
  els.mainListEl.innerHTML = html;
}

function renderMastermind() {
  var g = games.mastermind;
  els.mainPanelTitle.textContent = '📝 Lịch sử đoán';
  els.mainPanelSub.textContent = g.history.length + ' lượt';

  if (g.history.length === 0) {
    els.mainListEl.innerHTML = '<div class="mm-empty">Chưa có lượt nào. Nhập dãy bên dưới 👇</div>';
    return;
  }

  var html = '';
  for (var i = g.history.length - 1; i >= 0; i--) {
    var item = g.history[i];
    var isWin = item.exact === g.secret.length;
    var wrong = g.secret.length - item.exact - item.colorOnly;
    
    html += '<div class="mm-history' + (isWin ? ' win' : '') + '">';
    html += '<span class="mm-num">#' + (i+1) + '</span>';
    html += '<span class="mm-guess">';
    for (var j = 0; j < item.guess.length; j++) {
      html += '<span class="mm-digit">' + item.guess[j] + '</span>';
    }
    html += '</span>';
    
    // Giao diện mới: Hiện số lượng rõ ràng (VD: 1✓ 1◐ 1✕)
    html += '<span class="mm-feedback">';
    if (item.exact > 0) html += '<span class="fb-count exact">' + item.exact + ' ✓</span>';
    if (item.colorOnly > 0) html += '<span class="fb-count color">' + item.colorOnly + ' ◐</span>';
    if (wrong > 0) html += '<span class="fb-count wrong">' + wrong + ' ✕</span>';
    html += '</span>';
    html += '</div>';
  }
  els.mainListEl.innerHTML = html;
}

function renderStory() {
  var g = games.story;
  var story = STORIES[g.storyIdx];
  els.mainPanelTitle.textContent = '📖 Câu chuyện';
  els.mainPanelSub.textContent = 'Tập ' + (g.storyIdx + 1) + '/' + STORIES.length;

  var html = '<div class="story-card">';
  html += '<div class="story-title">' + escapeHtml(story.title) + '</div>';
  html += '<div class="story-text">' + escapeHtml(story.text) + '</div>';
  html += '</div>';
  els.mainListEl.innerHTML = html;
}

// ============ RENDER HINT ============
function renderHint() {
  var g = games[currentGame];
  var keys = Object.keys(g.revealed);
  if (keys.length === 0) {
    els.hintDisplayEl.classList.remove('show');
    els.hintDisplayEl.textContent = '';
    return;
  }
  var parts = [];
  var n = g.secret.length;
  var labels = (currentGame === 'story') ? STORIES[g.storyIdx].labels : null;
  
  for (var i = 0; i < n; i++) {
    if (i in g.revealed) {
      var label = labels ? labels[i] : ('Số ' + (i+1));
      parts.push(label + ' = ' + g.revealed[i]);
    }
  }
  els.hintDisplayEl.textContent = '💡 ' + parts.join(' • ');
  els.hintDisplayEl.classList.add('show');
}

// ============ RENDER INPUT ============
function renderInput() {
  var g = games[currentGame];
  var n = g.secret.length;
  var labels = (currentGame === 'story') ? STORIES[g.storyIdx].labels : null;
  
  var html = '';
  for (var i = 0; i < n; i++) {
    var isRev = (i in g.revealed);
    var val = '';
    if (isRev) val = g.revealed[i];
    else if (g.currentGuess[i] !== null && g.currentGuess[i] !== undefined) val = g.currentGuess[i];

    var slotLabel = labels ? labels[i] : ('Số ' + (i+1));

    html += '<div class="input-slot">';
    html += '<div class="slot-label">' + escapeHtml(slotLabel) + '</div>';
    html += '<input class="slot-input' +
            (isRev ? ' revealed' : '') +
            (val !== '' ? ' filled' : '') +
            '" data-pos="' + i + '" type="tel" inputmode="numeric" maxlength="1" placeholder="?" value="' + val + '"' +
            (isRev ? ' readonly' : '') + ' autocomplete="off">';
    html += '</div>';
  }
  els.inputRowEl.innerHTML = html;
  bindInputs();
}

function bindInputs() {
  var g = games[currentGame];
  var inputs = els.inputRowEl.querySelectorAll('.slot-input');
  for (var k = 0; k < inputs.length; k++) {
    (function(inp, idx) {
      if (inp.readOnly) return;

      inp.oninput = function() {
        if (g.gameOver) { inp.value = ''; return; }
        var v = inp.value.replace(/[^0-9]/g, '');
        if (v.length > 1) v = v.slice(-1);
        inp.value = v;
        if (v !== '') {
          g.currentGuess[idx] = parseInt(v, 10);
          inp.classList.add('filled');
          for (var n = idx + 1; n < g.secret.length; n++) {
            var next = els.inputRowEl.querySelector('.slot-input[data-pos="' + n + '"]');
            if (next && !next.readOnly) {
              setTimeout(function() { next.focus(); }, 50);
              break;
            }
          }
        } else {
          g.currentGuess[idx] = null;
          inp.classList.remove('filled');
        }
      };

      inp.onkeydown = function(e) {
        if (e.key === 'Backspace' && inp.value === '' && idx > 0) {
          for (var n = idx - 1; n >= 0; n--) {
            var prev = els.inputRowEl.querySelector('.slot-input[data-pos="' + n + '"]');
            if (prev && !prev.readOnly) {
              e.preventDefault();
              prev.focus();
              prev.select();
              break;
            }
          }
        }
        if (e.key === 'Enter') { e.preventDefault(); inp.blur(); submitGuess(); }
      };

      inp.onfocus = function() { setTimeout(function() { inp.select(); }, 0); };
    })(inputs[k], k);
  }
}

// ============ HUD UPDATE ============
function updateHUD() {
  var g = games[currentGame];
  var left = g.maxAttempts - g.attempts;
  els.attemptLeftEl.textContent = left;
  els.highScoreEl.textContent = g.high;
  els.scoreTotalEl.textContent = g.total;
  pulseStat(els.attemptStatEl);
}

// ============ SUBMIT GUESS ============
function submitGuess() {
  var g = games[currentGame];
  if (g.gameOver) { showToast('Ván đã kết thúc!', 'no'); return; }

  for (var i = 0; i < g.secret.length; i++) {
    if (g.currentGuess[i] === null || g.currentGuess[i] === undefined) {
      showToast('Nhập đủ ' + g.secret.length + ' số!', 'no');
      return;
    }
  }

  for (var pos in g.revealed) {
    var p = parseInt(pos, 10);
    if (g.currentGuess[p] !== g.revealed[p]) {
      showToast('Ô đã gợi ý phải giữ nguyên!', 'no');
      return;
    }
  }

  if (currentGame === 'mastermind') submitMastermind();
  else submitSimple();
}

function submitSimple() {
  var g = games[currentGame];
  var correct = true;
  for (var k = 0; k < g.secret.length; k++) {
    if (g.currentGuess[k] !== g.secret[k]) { correct = false; break; }
  }

  g.attempts++;

  if (correct) { endGame(true); return; }
  if (g.attempts >= g.maxAttempts) { endGame(false); return; }

  showToast('Sai rồi! Còn ' + (g.maxAttempts - g.attempts) + ' lượt', 'no');
  updateHUD();

  for (var m = 0; m < g.secret.length; m++) {
    if (!(m in g.revealed)) g.currentGuess[m] = null;
  }
  renderInput();
}

function submitMastermind() {
  var g = games.mastermind;
  var fb = getMastermindFeedback(g.secret, g.currentGuess);

  g.history.push({
    guess: g.currentGuess.slice(),
    exact: fb.exact,
    colorOnly: fb.colorOnly
  });

  g.attempts++;
  updateHUD();

  if (fb.exact === g.secret.length) {
    renderMastermind();
    endGame(true);
    return;
  }

  if (g.attempts >= g.maxAttempts) {
    renderMastermind();
    endGame(false);
    return;
  }

  for (var k = 0; k < g.secret.length; k++) {
    if (!(k in g.revealed)) g.currentGuess[k] = null;
  }

  renderMastermind();
  renderInput();
  showToast('Sai rồi! Còn ' + (g.maxAttempts - g.attempts) + ' lượt', 'info');
}

function getMastermindFeedback(secretArr, guessArr) {
  var n = secretArr.length;
  var secretMatched = new Array(n).fill(false);
  var guessMatched = new Array(n).fill(false);
  var exact = 0, colorOnly = 0;

  for (var i = 0; i < n; i++) {
    if (guessArr[i] === secretArr[i]) {
      exact++;
      secretMatched[i] = true;
      guessMatched[i] = true;
    }
  }

  for (var i = 0; i < n; i++) {
    if (guessMatched[i]) continue;
    for (var j = 0; j < n; j++) {
      if (secretMatched[j]) continue;
      if (guessArr[i] === secretArr[j]) {
        colorOnly++;
        secretMatched[j] = true;
        break;
      }
    }
  }

  return { exact: exact, colorOnly: colorOnly };
}

// ============ HINT ============
function applyHint() {
  var g = games[currentGame];
  if (g.gameOver) { showToast('Ván đã kết thúc!', 'no'); return; }

  if (currentGame === 'mastermind') {
    if (g.hintsUsed >= g.maxHints) { showToast('Hết hint rồi!', 'no'); return; }
  } else {
    if (g.hintUsed) { showToast('Đã dùng hint rồi!', 'no'); return; }
  }

  var avail = [];
  for (var i = 0; i < g.secret.length; i++) {
    if (!(i in g.revealed)) avail.push(i);
  }
  if (avail.length === 0) { showToast('Đã lộ hết rồi!', 'no'); return; }

  var pos = avail[Math.floor(Math.random() * avail.length)];
  g.revealed[pos] = g.secret[pos];
  g.currentGuess[pos] = g.secret[pos];

  if (currentGame === 'mastermind') {
    g.hintsUsed++;
    if (g.hintsUsed >= g.maxHints) els.hintBtn.disabled = true;
  } else {
    g.hintUsed = true;
    els.hintBtn.disabled = true;
  }

  renderHint();
  renderInput();
  showToast('💡 Lộ 1 số (-10đ)', 'info');
}

// ============ END GAME ============
function endGame(won) {
  var g = games[currentGame];
  g.gameOver = true;
  els.submitBtn.disabled = true;
  els.hintBtn.disabled = true;

  var points = 0;
  var isNewRecord = false;
  var hintPenalty = 0;

  if (currentGame === 'mastermind') hintPenalty = g.hintsUsed * 10;
  else hintPenalty = g.hintUsed ? 10 : 0;

  if (won) {
    if (currentGame === 'math' || currentGame === 'story') {
      var baseByAtt = [0, 500, 300, 150];
      points = Math.max(50, (baseByAtt[g.attempts] || 100) - hintPenalty);
    } else {
      var baseMM = [0, 1000, 800, 650, 500, 400, 300, 200, 150];
      points = Math.max(50, (baseMM[g.attempts] || 100) - hintPenalty);
    }

    g.total += points;
    els.scoreTotalEl.textContent = g.total;

    if (points > g.high) {
      isNewRecord = true;
      g.high = points;
      els.highScoreEl.textContent = g.high;
      pulseStat(els.highStatEl);
    }

    saveGameStats(currentGame);
    saveToLB(points, g.attempts);
  }

  if (isNewRecord) {
    showToast('🏆 KỶ LỤC MỚI! ' + g.high + 'đ', 'record');
  }

  showResult(won, points, isNewRecord);
}

function saveToLB(points, attempts) {
  var lb = getLB(currentGame);
  lb.push({
    name: playerName,
    score: points,
    level: games[currentGame].level,
    attempts: attempts,
    date: Date.now()
  });
  lb.sort(function(a, b) { return b.score - a.score; });
  lb = lb.slice(0, 10);
  saveLBTo(currentGame, lb);
}

// ============ SHOW RESULT ============
function showResult(won, points, isNewRecord) {
  var g = games[currentGame];
  var labels = (currentGame === 'story') ? STORIES[g.storyIdx].labels : null;
  var html = '';

  if (won) {
    html += '<h2 class="win">🎉 CHÍNH XÁC!</h2>';
    html += '<p>Bạn đoán đúng sau <b>' + g.attempts + '</b> lượt!</p>';
  } else {
    html += '<h2>😅 HẾT LƯỢT!</h2>';
    html += '<p>Đáp án đúng là:</p>';
  }

  html += '<div class="secret-reveal">';
  for (var i = 0; i < g.secret.length; i++) {
    var label = labels ? labels[i] : ('Số ' + (i+1));
    html += '<div class="secret-item">';
    html += '<div class="secret-label">' + escapeHtml(label) + '</div>';
    html += '<div class="secret-num">' + g.secret[i] + '</div>';
    html += '</div>';
  }
  html += '</div>';

  if (isNewRecord) {
    html += '<div class="record-banner">🏆 KỶ LỤC MỚI: ' + g.high + ' điểm!</div>';
  }

  if (won) {
    html += '<p>+<b>' + points + '</b> điểm</p>';
    html += '<p style="font-size:11px;color:#666">High: ' + g.high + ' • Tổng: ' + g.total + '</p>';
  } else {
    html += '<p style="font-size:11px;color:#ef476f">Không được điểm lần này</p>';
    html += '<p style="font-size:11px;color:#666">High: ' + g.high + ' • Tổng: ' + g.total + '</p>';
  }

  var lb = getLB(currentGame);
  if (lb.length > 0) {
    html += '<div class="leaderboard"><h3>🏆 TOP 10</h3>';
    for (var m = 0; m < Math.min(lb.length, 10); m++) {
      var medal = m===0?'🥇':m===1?'🥈':m===2?'🥉':(m+1)+'.';
      html += '<div class="lb-row"><span class="rank">'+medal+'</span><span class="name">'+escapeHtml(lb[m].name)+'</span><span class="pts">'+lb[m].score+'</span></div>';
    }
    html += '</div>';
  }

  if (won) {
    html += '<button id="nextLvBtn" type="button" class="tertiary">LEVEL TIẾP ▶</button>';
    html += '<button id="againBtn" type="button" class="secondary">CHƠI LẠI</button>';
  } else {
    html += '<button id="againBtn" type="button">THỬ LẠI 🔁</button>';
    html += '<button id="menuBtn" type="button" class="secondary">VỀ MENU</button>';
  }

  showOverlay(html);

  if (won) {
    document.getElementById('nextLvBtn').onclick = function() {
      g.level++;
      els.levelStatEl.textContent = g.level;
      prepareGame(currentGame);
    };
    document.getElementById('againBtn').onclick = function() {
      prepareGame(currentGame);
    };
  } else {
    document.getElementById('againBtn').onclick = function() {
      prepareGame(currentGame);
    };
    document.getElementById('menuBtn').onclick = function() {
      backToMenu();
    };
  }
}

// ============ MATH PUZZLE - SINH PHƯƠNG TRÌNH ============
function generateEquationPool(s) {
  var n = s.length;
  var all = [];
  var i, j, k;

  for (i = 0; i < n; i++) {
    for (j = i + 1; j < n; j++) {
      (function(a, b) {
        var val = s[a] + s[b];
        all.push({ text: 'Số ' + (a+1) + ' + Số ' + (b+1) + ' = ' + val, strength: 1, hard: false, check: function(arr) { return arr[a] + arr[b] === val; } });
      })(i, j);
    }
  }
  for (i = 0; i < n; i++) {
    for (j = i + 1; j < n; j++) {
      if (s[i] === s[j]) continue;
      (function(a, b) {
        var hi = s[a] > s[b] ? a : b; var lo = s[a] > s[b] ? b : a; var val = Math.abs(s[a] - s[b]);
        all.push({ text: 'Số ' + (hi+1) + ' - Số ' + (lo+1) + ' = ' + val, strength: 1, hard: false, check: function(arr) { return Math.abs(arr[a] - arr[b]) === val; } });
      })(i, j);
    }
  }
  for (i = 0; i < n; i++) {
    for (j = i + 1; j < n; j++) {
      if (s[i] === 0 || s[j] === 0) continue;
      (function(a, b) {
        var val = s[a] * s[b];
        all.push({ text: 'Số ' + (a+1) + ' × Số ' + (b+1) + ' = ' + val, strength: 1.5, hard: false, check: function(arr) { return arr[a] * arr[b] === val; } });
      })(i, j);
    }
  }
  if (n >= 3) {
    (function() {
      var total = 0; var parts = [];
      for (var x = 0; x < n; x++) { total += s[x]; parts.push('Số ' + (x+1)); }
      all.push({ text: parts.join(' + ') + ' = ' + total, strength: 1.5, hard: false, check: function(arr) { var t = 0; for (var y = 0; y < arr.length; y++) t += arr[y]; return t === total; } });
    })();
  }
  for (i = 0; i < n; i++) {
    (function(a) {
      var val = s[a] * s[a];
      all.push({ text: 'Số ' + (a+1) + '² = ' + val, strength: 2, hard: true, check: function(arr) { return arr[a] * arr[a] === val; } });
    })(i);
  }
  if (n >= 2) {
    (function() {
      var total = 0; var parts = [];
      for (var x = 0; x < n; x++) { total += s[x] * s[x]; parts.push('Số ' + (x+1) + '²'); }
      all.push({ text: parts.join(' + ') + ' = ' + total, strength: 2.5, hard: true, check: function(arr) { var t = 0; for (var y = 0; y < arr.length; y++) t += arr[y] * arr[y]; return t === total; } });
    })();
  }
  for (i = 0; i < n; i++) {
    for (j = 0; j < n; j++) {
      if (i === j || s[i] <= s[j]) continue;
      (function(a, b) {
        var val = s[a]*s[a] - s[b]*s[b];
        all.push({ text: 'Số ' + (a+1) + '² - Số ' + (b+1) + '² = ' + val, strength: 2, hard: true, check: function(arr) { return arr[a]*arr[a] - arr[b]*arr[b] === val; } });
      })(i, j);
    }
  }
  for (i = 0; i < n; i++) {
    for (j = 0; j < n; j++) {
      if (i === j || s[j] === 0 || s[i] % s[j] !== 0) continue;
      (function(a, b) {
        var val = s[a] / s[b];
        all.push({ text: 'Số ' + (a+1) + ' ÷ Số ' + (b+1) + ' = ' + val, strength: 2, hard: true, check: function(arr) { return arr[b] !== 0 && arr[a] / arr[b] === val; } });
      })(i, j);
    }
  }
  for (i = 0; i < n; i++) {
    for (j = 0; j < n; j++) {
      if (i === j) continue;
      (function(a, b) {
        var val = s[a] * 2 + s[b];
        all.push({ text: 'Số ' + (a+1) + ' × 2 + Số ' + (b+1) + ' = ' + val, strength: 2, hard: true, check: function(arr) { return arr[a] * 2 + arr[b] === val; } });
      })(i, j);
    }
  }
  for (i = 0; i < n; i++) {
    for (j = 0; j < n; j++) {
      if (i === j) continue;
      (function(a, b) {
        var val = s[a] * s[a] + s[b];
        all.push({ text: 'Số ' + (a+1) + '² + Số ' + (b+1) + ' = ' + val, strength: 2, hard: true, check: function(arr) { return arr[a] * arr[a] + arr[b] === val; } });
      })(i, j);
    }
  }
  if (n >= 3) {
    for (i = 0; i < n; i++) {
      for (j = i + 1; j < n; j++) {
        for (k = j + 1; k < n; k++) {
          (function(a, b, c) {
            var val = s[a] * s[b] * s[c];
            all.push({ text: 'Số ' + (a+1) + ' × Số ' + (b+1) + ' × Số ' + (c+1) + ' = ' + val, strength: 2.5, hard: true, check: function(arr) { return arr[a] * arr[b] * arr[c] === val; } });
          })(i, j, k);
        }
      }
    }
  }
  if (n >= 3) {
    for (i = 0; i < n; i++) {
      for (j = i + 1; j < n; j++) {
        for (k = 0; k < n; k++) {
          if (k === i || k === j) continue;
          (function(a, b, c) {
            var val = (s[a] + s[b]) * s[c];
            all.push({ text: '(Số ' + (a+1) + ' + Số ' + (b+1) + ') × Số ' + (c+1) + ' = ' + val, strength: 2.5, hard: true, check: function(arr) { return (arr[a] + arr[b]) * arr[c] === val; } });
          })(i, j, k);
        }
      }
    }
  }
  if (n >= 3) {
    for (i = 0; i < n; i++) {
      for (j = i + 1; j < n; j++) {
        for (k = 0; k < n; k++) {
          if (k === i || k === j) continue;
          (function(a, b, c) {
            var val = s[a] * s[b] + s[c];
            all.push({ text: 'Số ' + (a+1) + ' × Số ' + (b+1) + ' + Số ' + (c+1) + ' = ' + val, strength: 2, hard: true, check: function(arr) { return arr[a] * arr[b] + arr[c] === val; } });
          })(i, j, k);
        }
      }
    }
  }
  return all;
}

function countMathSolutions(pts, n, maxV, limit) {
  var count = 0;
  var total = Math.pow(maxV + 1, n);
  for (var x = 0; x < total; x++) {
    var arr = [];
    var tmp = x;
    for (var i = 0; i < n; i++) {
      arr.push(tmp % (maxV + 1));
      tmp = Math.floor(tmp / (maxV + 1));
    }
    var ok = true;
    for (var p = 0; p < pts.length; p++) {
      if (!pts[p].check(arr)) { ok = false; break; }
    }
    if (ok) {
      count++;
      if (count >= limit) return count;
    }
  }
  return count;
}

function buildMathPuzzle(s) {
  var n = s.length;
  var maxV = 9;
  var all = generateEquationPool(s);

  var strong = [], medium = [], weak = [];
  for (var i = 0; i < all.length; i++) {
    if (all[i].strength >= 2.5) strong.push(all[i]);
    else if (all[i].strength >= 2) medium.push(all[i]);
    else weak.push(all[i]);
  }

  if (strong.length >= 2 && medium.length >= 1) {
    for (var t1 = 0; t1 < 6; t1++) { shuffle(strong); shuffle(medium); var sel1 = strong.slice(0, 2).concat(medium.slice(0, 1)); if (countMathSolutions(sel1, n, maxV, 2) === 1) return sel1; }
  }
  if (strong.length >= 3) {
    for (var t2 = 0; t2 < 6; t2++) { shuffle(strong); var sel2 = strong.slice(0, 3); if (countMathSolutions(sel2, n, maxV, 2) === 1) return sel2; }
  }
  if (strong.length >= 2 && medium.length >= 2) {
    for (var t3 = 0; t3 < 6; t3++) { shuffle(strong); shuffle(medium); var sel3 = strong.slice(0, 2).concat(medium.slice(0, 2)); if (countMathSolutions(sel3, n, maxV, 2) === 1) return sel3; }
  }
  if (strong.length >= 1 && medium.length >= 3) {
    for (var t4 = 0; t4 < 6; t4++) { shuffle(strong); shuffle(medium); var sel4 = strong.slice(0, 1).concat(medium.slice(0, 3)); if (countMathSolutions(sel4, n, maxV, 2) === 1) return sel4; }
  }
  var combined = strong.concat(medium).concat(weak);
  shuffle(combined);
  for (var k = 3; k <= Math.min(6, combined.length); k++) {
    if (countMathSolutions(combined.slice(0, k), n, maxV, 2) === 1) return combined.slice(0, k);
  }
  return combined.slice(0, Math.min(4, combined.length));
}

function shuffle(arr) {
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }
}

// ============ UTILS ============
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
