<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🔧 Máy Turing Crayon</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body {
    margin:0; padding:0; width:100%; height:100%;
    overflow:hidden; background:#fdf6e3;
    font-family:'Comic Sans MS','Chalkboard SE','Segoe Print',cursive;
    touch-action:manipulation;
  }
  #app {
    width:100%; height:100%;
    display:flex; flex-direction:column;
    padding:4px; gap:3px;
    max-width:520px; margin:0 auto;
  }
  header { flex-shrink:0; text-align:center; padding:1px 0; }
  h1 {
    margin:0; font-size:clamp(14px,4.2vw,18px);
    color:#2d3142;
    text-shadow:2px 2px 0 #ffd166, -1px -1px 0 #ef476f;
    transform:rotate(-0.5deg);
  }
  #hud {
    display:flex; justify-content:center; gap:4px;
    flex-shrink:0; flex-wrap:wrap;
  }
  .stat {
    background:#fff;
    border:2px solid #2d3142;
    border-radius:10px 4px 12px 5px / 5px 12px 4px 10px;
    padding:2px 8px;
    font-size:clamp(10px,2.9vw,12px);
    color:#2d3142; font-weight:bold;
    box-shadow:2px 2px 0 rgba(45,49,66,0.35);
    white-space:nowrap;
  }
  .stat span { color:#ef476f; }
  .stat:nth-child(2) span { color:#06d6a0; }
  .stat:nth-child(3) span { color:#118ab2; }
  .stat.pulse { animation:pulseStat 0.35s; }
  @keyframes pulseStat {
    0%,100% { transform:scale(1); }
    50% { transform:scale(1.18); background:#ffd166; }
  }

  #targetPanel {
    flex-shrink:0;
    background:linear-gradient(135deg, #fffef8, #fff8e7);
    border:3px solid #2d3142;
    border-radius:14px 5px 16px 7px / 7px 16px 5px 14px;
    box-shadow:3px 3px 0 rgba(45,49,66,0.35);
    padding:5px 4px;
    display:flex; flex-direction:column;
  }
  #targetTitle {
    text-align:center;
    font-size:clamp(10px,2.9vw,12px);
    color:#2d3142; font-weight:bold;
    margin-bottom:2px;
    flex-shrink:0;
  }
  #targetClue {
    text-align:center;
    font-size:clamp(10px,2.9vw,12px);
    color:#ef476f; font-weight:bold;
    background:#fff8e7;
    border:2px dashed #ffd166;
    border-radius:7px;
    padding:3px 8px;
    margin:2px 4px 5px;
    flex-shrink:0;
  }
  #slotsRow {
    display:flex;
    justify-content:center;
    gap:4px;
    flex-wrap:wrap;
  }
  .slot {
    display:flex; flex-direction:column;
    align-items:center;
    background:#fff;
    border:2.5px solid #2d3142;
    border-radius:9px 4px 9px 4px / 4px 9px 4px 9px;
    box-shadow:2px 2px 0 rgba(45,49,66,0.3);
    padding:3px;
    min-width:52px;
    max-width:64px;
    flex:0 0 auto;
  }
  .slot-main {
    width:100%;
    font-size:clamp(20px,5.5vw,26px);
    font-weight:bold;
    color:#2d3142;
    line-height:1.1;
    min-height:26px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#fffef8;
    border:2px dashed #ccc;
    border-radius:5px;
    text-align:center;
    font-family:'Comic Sans MS', cursive;
    -webkit-appearance:none;
    outline:none;
    padding:2px 0;
    cursor:text;
  }
  .slot-main:focus {
    border-color:#ef476f;
    border-style:solid;
    box-shadow:0 0 0 2px rgba(239,71,111,0.2);
  }
  .slot-main::placeholder { color:#ccc; }
  .slot-main.filled { border-style:solid; border-color:#06d6a0; background:#d4f8e4; }
  .slot-label {
    font-size:clamp(7px,2vw,9px);
    color:#888;
    font-family:sans-serif;
    margin-bottom:2px;
  }
  .mini-grid {
    display:grid;
    grid-template-columns:repeat(5, 1fr);
    gap:1px;
    width:100%;
    margin-top:2px;
  }
  .mini-cell {
    font-size:clamp(8px,2.4vw,10px);
    font-family:sans-serif;
    font-weight:bold;
    color:#2d3142;
    background:#e8f4ff;
    border:1px solid #99c9e8;
    border-radius:3px;
    text-align:center;
    padding:1px 0;
    cursor:pointer;
    transition:all 0.1s;
    -webkit-appearance:none;
    line-height:1;
  }
  .mini-cell:active { transform:scale(0.9); }
  .mini-cell.eliminated {
    background:#ddd;
    color:#aaa;
    text-decoration:line-through;
    border-color:#bbb;
  }
  #targetHint {
    text-align:center;
    font-size:clamp(8px,2.4vw,10px);
    color:#118ab2;
    font-style:italic;
    margin-top:2px;
    flex-shrink:0;
  }

  #questionsPanel {
    flex:1; min-height:0;
    background:#fffef8;
    border:2px solid #2d3142;
    border-radius:11px 4px 13px 6px / 6px 13px 4px 11px;
    box-shadow:2px 2px 0 rgba(45,49,66,0.3);
    padding:4px 6px;
    display:flex; flex-direction:column;
    overflow:hidden;
  }
  #qFilter {
    display:flex; gap:3px; margin-bottom:3px;
    flex-shrink:0;
    overflow-x:auto;
    padding-bottom:2px;
  }
  .filter-btn {
    font-family:inherit;
    font-size:clamp(8px,2.3vw,10px);
    padding:2px 6px;
    border:1.5px solid #2d3142;
    border-radius:7px;
    background:#fff;
    color:#2d3142;
    cursor:pointer;
    white-space:nowrap;
    -webkit-appearance:none;
    flex-shrink:0;
  }
  .filter-btn.active { background:#ffd166; font-weight:bold; }
  #questionsList {
    flex:1; overflow-y:auto;
    display:flex; flex-direction:column; gap:2px;
    -webkit-overflow-scrolling:touch;
    padding-right:2px;
  }
  .q-btn {
    padding:6px 8px;
    background:#fff;
    border:1.5px solid #2d3142;
    border-radius:8px 3px 9px 4px / 4px 9px 3px 8px;
    font-family:inherit;
    font-size:clamp(9px,2.6vw,11px);
    color:#2d3142;
    font-weight:bold;
    text-align:left;
    cursor:pointer;
    box-shadow:1.5px 1.5px 0 rgba(45,49,66,0.25);
    -webkit-appearance:none;
    line-height:1.2;
    width:100%;
    flex-shrink:0;
    display:flex; align-items:center; gap:4px;
    transition:all 0.1s;
  }
  .q-btn:active {
    transform:translate(1px,1px);
    box-shadow:0.5px 0.5px 0 rgba(45,49,66,0.25);
    background:#ffd166;
  }
  .q-btn.used { pointer-events:none; transform:none !important; }
  .q-btn.used.yes { background:#d4f8e4; border-color:#06d6a0; cursor:default; }
  .q-btn.used.no { background:#ffe4e6; border-color:#ef476f; cursor:default; }
  .q-num { font-size:0.85em; color:#888; min-width:14px; text-align:right; flex-shrink:0; }
  .q-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
  .q-dot.tier1 { background:#06d6a0; }
  .q-dot.tier2 { background:#ffd166; }
  .q-dot.tier3 { background:#ef476f; }
  .q-text { flex:1; line-height:1.2; }
  .q-answer {
    font-weight:bold; padding:1px 6px;
    border-radius:5px; font-size:0.85em;
    white-space:nowrap; flex-shrink:0;
  }
  .q-cost { font-size:0.8em; color:#888; font-weight:normal; margin-left:2px; }
  .q-btn.used.yes .q-answer { background:#06d6a0; color:#fff; }
  .q-btn.used.no .q-answer { background:#ef476f; color:#fff; }

  #guessBtn {
    flex-shrink:0;
    padding:9px;
    background:#ef476f;
    color:#fff;
    border:3px solid #2d3142;
    border-radius:12px 4px 14px 6px / 6px 14px 4px 12px;
    font-family:inherit;
    font-weight:bold;
    font-size:clamp(12px,3.3vw,15px);
    cursor:pointer;
    box-shadow:2.5px 2.5px 0 #2d3142;
    -webkit-appearance:none;
    letter-spacing:1px;
    width:100%;
  }
  #guessBtn:active { transform:translate(1.5px,1.5px); box-shadow:1px 1px 0 #2d3142; }
  #guessBtn:disabled { background:#ccc; color:#666; cursor:not-allowed; box-shadow:2px 2px 0 #999; }

  #toast {
    position:fixed; top:50%; left:50%;
    transform:translate(-50%, -50%) scale(0.3);
    background:#fff;
    border:4px solid #2d3142;
    border-radius:18px;
    padding:14px 30px;
    font-family:'Comic Sans MS', cursive;
    font-size:clamp(24px,7vw,34px);
    font-weight:bold;
    box-shadow:5px 5px 0 rgba(45,49,66,0.5);
    z-index:1000;
    pointer-events:none;
    opacity:0;
    transition:all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  #toast.show { opacity:1; transform:translate(-50%, -50%) scale(1); }
  #toast.yes { background:#06d6a0; color:#fff; }
  #toast.no { background:#ef476f; color:#fff; }
  #toast.info { background:#118ab2; color:#fff; font-size:clamp(16px,5vw,22px); }

  #overlay {
    position:fixed; inset:0;
    background:rgba(253, 246, 227, 0.97);
    display:flex; flex-direction:column;
    justify-content:center; align-items:center;
    text-align:center; padding:16px;
    z-index:100;
    overflow-y:auto;
  }
  #overlay.hidden { display:none; }
  #overlay h2 {
    font-size:clamp(18px,5.5vw,26px);
    color:#ef476f;
    margin:0 0 8px;
    text-shadow:2px 2px 0 #ffd166;
    transform:rotate(-2deg);
  }
  #overlay h2.win { color:#06d6a0; }
  #overlay p {
    font-size:clamp(11px,3.2vw,14px);
    color:#2d3142;
    margin:4px 0;
    line-height:1.4;
    max-width:340px;
  }
  #overlay b { color:#06d6a0; }
  .secret-reveal { display:flex; gap:5px; margin:8px 0; justify-content:center; flex-wrap:wrap; }
  .secret-num {
    width:36px; height:36px;
    background:#ffd166;
    border:3px solid #2d3142;
    border-radius:10px 3px 10px 3px / 3px 10px 3px 10px;
    display:flex; align-items:center; justify-content:center;
    font-size:17px; font-weight:bold; color:#2d3142;
    box-shadow:2px 2px 0 rgba(45,49,66,0.4);
  }
  #overlay button {
    margin-top:8px;
    padding:10px 24px;
    font-size:clamp(12px,3.6vw,15px);
    font-weight:bold;
    font-family:inherit;
    color:#fff;
    background:#ef476f;
    border:3px solid #2d3142;
    border-radius:12px 4px 14px 6px / 6px 14px 4px 12px;
    box-shadow:2.5px 2.5px 0 #2d3142;
    cursor:pointer;
    -webkit-appearance:none;
  }
  #overlay button:active { transform:translate(1.5px,1.5px); box-shadow:1px 1px 0 #2d3142; }
  #overlay button.secondary { background:#118ab2; margin-left:5px; }
  #overlay button.tertiary { background:#06d6a0; }

  .mode-btn {
    display:block;
    width:100%; max-width:280px;
    margin:5px auto;
    padding:10px;
    font-family:inherit;
    font-size:clamp(12px,3.6vw,14px);
    font-weight:bold;
    color:#2d3142;
    background:#fff;
    border:3px solid #2d3142;
    border-radius:12px 4px 14px 6px / 6px 14px 4px 12px;
    box-shadow:2.5px 2.5px 0 rgba(45,49,66,0.4);
    cursor:pointer;
    text-align:left;
    -webkit-appearance:none;
  }
  .mode-btn:active { transform:translate(1.5px,1.5px); box-shadow:1px 1px 0 rgba(45,49,66,0.4); }
  .mode-btn .desc { display:block; font-size:0.8em; font-weight:normal; color:#666; margin-top:2px; }
  .mode-btn.active { background:#ffd166; }

  .name-input {
    padding:9px 12px;
    font-size:14px;
    font-family:inherit;
    border:2.5px solid #2d3142;
    border-radius:11px;
    background:#fff;
    text-align:center;
    width:200px; max-width:85%;
    color:#2d3142;
    outline:none;
    margin:5px 0;
  }
  .name-input:focus { border-color:#ef476f; box-shadow:0 0 0 3px rgba(239,71,111,0.2); }

  .leaderboard {
    width:100%; max-width:340px;
    margin:5px auto;
    background:#fff;
    border:2.5px solid #2d3142;
    border-radius:11px;
    padding:5px 8px;
    text-align:left;
  }
  .leaderboard h3 {
    margin:0 0 4px;
    font-size:12px; color:#2d3142; text-align:center;
    border-bottom:2px dashed #ffd166; padding-bottom:3px;
  }
  .lb-row {
    display:flex; justify-content:space-between;
    padding:2px 3px; font-size:11px; color:#2d3142; border-radius:4px;
  }
  .lb-row:first-child { background:#ffd166; font-weight:bold; }
  .lb-row .rank { width:20px; }
  .lb-row .name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lb-row .pts { color:#ef476f; font-weight:bold; }

  .start-input-row { display:flex; gap:5px; justify-content:center; margin:10px 0; flex-wrap:wrap; }
  .start-input {
    width:46px; height:56px;
    background:#fff;
    border:3px solid #2d3142;
    border-radius:11px 3px 11px 3px / 3px 11px 3px 11px;
    display:flex; align-items:center; justify-content:center;
    font-family:'Comic Sans MS', cursive;
    font-size:22px; font-weight:bold;
    color:#2d3142; text-align:center;
    -webkit-appearance:none; outline:none;
    box-shadow:2px 2.5px 0 rgba(45,49,66,0.35);
    padding:0;
  }
  .start-input:focus { border-color:#ef476f; box-shadow:0 0 0 3px rgba(239,71,111,0.2); }
  .start-input::placeholder { color:#ccc; }
  .start-input.filled { border-color:#06d6a0; background:#d4f8e4; }
  .hint-box {
    background:#fff8e7;
    border:2px dashed #ffd166;
    border-radius:10px;
    padding:10px 14px;
    margin:8px 0;
    max-width:300px;
    font-size:clamp(11px,3.2vw,14px);
    color:#2d3142;
  }
  .hint-box b { color:#118ab2; }
  .penalty-note { font-size:11px; color:#ef476f; font-style:italic; margin-top:4px; }

  /* Bảng giải thích từng số */
  .explain-box {
    width:100%; max-width:380px;
    margin:10px 0;
    background:#fff;
    border:2.5px solid #2d3142;
    border-radius:11px;
    padding:8px 10px;
    text-align:left;
    max-height:280px;
    overflow-y:auto;
  }
  .explain-box h4 {
    margin:0 0 6px;
    font-size:12px; color:#118ab2;
    text-align:center;
    border-bottom:2px dashed #ffd166;
    padding-bottom:3px;
  }
  .explain-summary {
    background:#fff8e7;
    border:2px dashed #ffd166;
    border-radius:7px;
    padding:5px 8px;
    margin-bottom:8px;
    font-size:11px;
    color:#2d3142;
    text-align:center;
  }
  .explain-summary b { color:#ef476f; }
  .explain-slot {
    background:#f8f9fc;
    border-left:4px solid #118ab2;
    border-radius:6px;
    padding:6px 8px;
    margin-bottom:6px;
  }
  .explain-slot-header {
    font-size:12px;
    font-weight:bold;
    color:#118ab2;
    margin-bottom:4px;
    padding-bottom:3px;
    border-bottom:1px dashed #ccc;
  }
  .explain-slot-header b { color:#06d6a0; }
  .explain-step {
    font-size:11px;
    color:#2d3142;
    padding:2px 0 2px 6px;
    border-left:2px solid #ccc;
    margin:2px 0 2px 3px;
    line-height:1.3;
  }
  .explain-step.step-yes { border-left-color:#06d6a0; }
  .explain-step.step-no { border-left-color:#ef476f; }
  .explain-step.step-clue { border-left-color:#ffd166; background:#fff8e7; }
  .explain-step .step-q { font-weight:bold; }
  .explain-step .step-ans { font-weight:bold; }
  .explain-step.step-yes .step-ans { color:#06d6a0; }
  .explain-step.step-no .step-ans { color:#ef476f; }
  .explain-step .step-elim { color:#ef476f; font-style:italic; }
  .explain-step .step-remain { color:#118ab2; font-weight:bold; }
  .explain-result {
    font-size:11px;
    font-weight:bold;
    color:#06d6a0;
    text-align:center;
    padding:4px;
    margin-top:4px;
    background:#d4f8e4;
    border-radius:5px;
  }
  .explain-empty {
    text-align:center;
    color:#888;
    font-style:italic;
    font-size:11px;
    padding:10px;
  }

  /* Nút tự hỏi */
  #customBtn {
    padding:5px 10px;
    background:#ffd166;
    color:#2d3142;
    border:2px solid #2d3142;
    border-radius:8px;
    font-family:inherit;
    font-weight:bold;
    font-size:clamp(9px,2.5vw,11px);
    cursor:pointer;
    box-shadow:1.5px 1.5px 0 rgba(45,49,66,0.3);
    margin-bottom:3px;
    flex-shrink:0;
    width:100%;
  }
  #customBtn:active { transform:translate(1px,1px); box-shadow:0.5px 0.5px 0 rgba(45,49,66,0.3); }

  /* Form tự hỏi */
  .form-overlay {
    width:100%; max-width:380px;
    background:#fffef8;
    border:3px solid #2d3142;
    border-radius:14px;
    padding:14px;
    box-shadow:4px 4px 0 rgba(45,49,66,0.4);
    text-align:left;
  }
  .form-row {
    margin:8px 0;
    display:flex;
    flex-wrap:wrap;
    gap:5px;
    align-items:center;
    font-size:clamp(11px,3vw,13px);
  }
  .form-row label { font-weight:bold; color:#2d3142; }
  .form-row select {
    padding:6px 8px;
    font-family:inherit;
    font-size:clamp(11px,3vw,13px);
    border:2px solid #2d3142;
    border-radius:7px;
    background:#fff;
    color:#2d3142;
    cursor:pointer;
    outline:none;
    -webkit-appearance:none;
    min-width:50px;
  }
  .form-row select:focus { border-color:#ef476f; }
  .form-preview {
    background:#fff8e7;
    border:2px dashed #ffd166;
    border-radius:8px;
    padding:8px;
    margin:10px 0;
    font-size:clamp(11px,3.2vw,14px);
    font-weight:bold;
    color:#2d3142;
    text-align:center;
  }
  .form-preview b { color:#ef476f; }
  .form-cost {
    text-align:center;
    font-size:11px;
    color:#ef476f;
    font-weight:bold;
    margin-bottom:8px;
  }
  .form-btns { text-align:center; }
  .form-btns button { margin:3px; }
  .form-btns button.cancel { background:#888; }
</style>
</head>
<body>

<div id="app">
  <header>
    <h1>🔧 MÁY TURING CRAYON</h1>
  </header>

  <div id="hud">
    <div class="stat" id="lvStat">Lv <span id="levelStat">1</span></div>
    <div class="stat" id="qStat">❓ <span id="qLeft">8</span></div>
    <div class="stat" id="scStat">🏆 <span id="scoreTotal">0</span></div>
  </div>

  <div id="targetPanel">
    <div id="targetTitle">🎯 TÌM DÃY SỐ SAU BIẾT RẰNG:</div>
    <div id="targetClue">...</div>
    <div id="slotsRow"></div>
    <div id="targetHint">💡 Gõ đáp án vào ô • Chạm số nhỏ để gạch bỏ</div>
  </div>

  <div id="questionsPanel">
    <div id="qFilter"></div>
    <button id="customBtn" type="button">✏️ TỰ TẠO CÂU HỎI</button>
    <div id="questionsList"></div>
  </div>

  <button id="guessBtn" type="button">🎯 XÁC NHẬN ĐOÁN</button>
</div>

<div id="toast"></div>

<div id="overlay">
  <h2>🔧 MÁY TURING CRAYON</h2>
  <p>Tìm dãy số bí ẩn bằng cách đặt câu hỏi Có/Không!</p>
  <p style="font-size:11px;color:#666">Gõ đáp án trực tiếp vào ô số để đoán</p>
  <button id="startBtn" type="button">BẮT ĐẦU 🖍️</button>
</div>

<script>
(function() {
'use strict';

// ============ MODES ============
var MODES = {
  easy:   { name:'Dễ',     startNums:3, min:0, max:9 },
  normal: { name:'Thường', startNums:4, min:0, max:9 },
  hard:   { name:'Khó',    startNums:5, min:0, max:9 }
};

// ============ STATE ============
var currentMode = 'normal';
var secret = [];
var numCount = 3;
var minVal = 0;
var maxVal = 9;
var questionsLeft = 8;
var questionsTotal = 8;
var askedMap = {};
var questionCounter = 0;
var gameOver = false;
var totalScore = 0;
var streak = 0;
var playerName = 'Người chơi';
var currentGuess = [];
var level = 1;

// ============ TOAST ============
var toastTimer = null;
function showToast(text, type) {
  els.toast.textContent = text;
  els.toast.className = 'show ' + (type || 'info');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { els.toast.className = ''; }, 1000);
  try { if (navigator.vibrate) navigator.vibrate(type === 'yes' ? 25 : [25,35,25]); } catch(e) {}
  playBeep(type === 'yes');
}

// ============ SOUND ============
var audioCtx = null;
function playBeep(high) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    var now = audioCtx.currentTime;
    osc.type = 'sine';
    osc.frequency.setValueAtTime(high ? 880 : 440, now);
    osc.frequency.exponentialRampToValueAtTime(high ? 1100 : 300, now + 0.1);
    gain.gain.setValueAtTime(0.08, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
    osc.start(now); osc.stop(now + 0.15);
  } catch(e) {}
}

// ============ TÍNH ĐIỂM ============
function calcBasePoints(lv) {
  return Math.min(300, 100 + (lv - 1) * 15);
}

function getQuestionCost(tier) {
  if (tier === 1) return 15;
  if (tier === 2) return 10;
  return 5;
}

// ============ LEVEL CONFIG ============
function getLevelConfig(lv) {
  lv = Math.max(1, parseInt(lv, 10) || 1);
  var m = MODES[currentMode] || MODES.normal;
  var nums = Math.min(7, m.startNums + Math.floor((lv - 1) / 3));
  nums = Math.max(3, nums);
  var qs = 8 + (nums - 3) * 2 + Math.min(4, lv - 1);
  return { nums: nums, min: m.min || 0, max: m.max || 9, questions: qs };
}

// ============ PREPARE VÁN ============
function prepareVan() {
  var cfg = getLevelConfig(level);
  numCount = cfg.nums;
  minVal = cfg.min;
  maxVal = cfg.max;
  questionsLeft = cfg.questions;
  questionsTotal = cfg.questions;
  askedMap = {};
  questionCounter = 0;
  askedLog = [];
  gameOver = false;
  currentGuess = [];
  currentFilter = 'all';
  eliminated = [];

  for (var i = 0; i < numCount; i++) {
    currentGuess.push(null);
    eliminated.push({});
  }

  secret = [];
  for (var j = 0; j < numCount; j++) {
    secret.push(minVal + Math.floor(Math.random() * (maxVal - minVal + 1)));
  }

  els.levelStatEl.textContent = level;
  els.qLeftEl.textContent = questionsLeft;

  showStartScreen();
}

// ============ MANH MỐI KHỞI ĐỘNG ============
function generateHint() {
  var hints = [];
  var types = [];
  var sum = 0;
  for (var i = 0; i < secret.length; i++) sum += secret[i];
  var avg = Math.round(sum / secret.length * 10) / 10;

  hints.push('Tổng ' + numCount + ' số = ' + sum + '.');
  types.push('sum:' + sum);

  hints.push('Trung bình cộng = ' + avg + '.');
  types.push('avg:' + avg);

  hints.push('Số đầu + số cuối = ' + (secret[0] + secret[secret.length-1]) + '.');
  types.push('firstlast:' + (secret[0] + secret[secret.length-1]));

  if (numCount >= 3) {
    hints.push('Tổng 2 số đầu = ' + (secret[0] + secret[1]) + '.');
    types.push('first2:' + (secret[0] + secret[1]));

    var maxIdx = 0, minIdx = 0;
    for (var k = 1; k < secret.length; k++) {
      if (secret[k] > secret[maxIdx]) maxIdx = k;
      if (secret[k] < secret[minIdx]) minIdx = k;
    }
    hints.push('Số lớn nhất - số nhỏ nhất = ' + (secret[maxIdx] - secret[minIdx]) + '.');
    types.push('maxmin:' + (secret[maxIdx] - secret[minIdx]));

    hints.push('Số lớn nhất = ' + secret[maxIdx] + '.');
    types.push('max:' + secret[maxIdx]);

    hints.push('Số nhỏ nhất = ' + secret[minIdx] + '.');
    types.push('min:' + secret[minIdx]);
  }

  var idx = Math.floor(Math.random() * hints.length);
  hintType = types[idx];
  return hints[idx];
}

function showStartScreen() {

  html += '<div class="hint-box">';
  html += '<b>Tìm dãy số sau biết:</b><br>';

  html += '<div class="start-input-row" id="startInputRow">';
  for (var i = 0; i < numCount; i++) {
    html += '<input class="start-input" data-pos="' + i + '" type="tel" inputmode="numeric" maxlength="1" placeholder="?" autocomplete="off">';
  }
  html += '</div>';

  html += '<p class="penalty-note">⚠️ Đoán sai sẽ bị -10 điểm</p>';

  html += '<div style="margin-top:10px">';
  html += '<button id="quickGuessBtn" type="button">ĐOÁN NGAY</button>';
  html += '<button id="startGameBtn" type="button" class="secondary">BẮT ĐẦU ĐI TÌM 🔍</button>';
  html += '</div>';

  showOverlay(html);

  var startInputs = els.overlay.querySelectorAll('.start-input');
  var startVals = [];
  for (var s = 0; s < numCount; s++) startVals.push(null);

  for (var k = 0; k < startInputs.length; k++) {
    (function(inp, idx) {
      inp.oninput = function() {
        var val = inp.value.replace(/[^0-9]/g, '');
        if (val.length > 1) val = val.slice(-1);
        inp.value = val;
        if (val !== '') {
          startVals[idx] = parseInt(val, 10);
          inp.classList.add('filled');
          if (idx < numCount - 1) {
            var next = els.overlay.querySelector('.start-input[data-pos="' + (idx+1) + '"]');
            if (next) setTimeout(function() { next.focus(); }, 50);
          }
        } else {
          startVals[idx] = null;
          inp.classList.remove('filled');
        }
      };
      inp.onkeydown = function(e) {
        if (e.key === 'Backspace' && inp.value === '' && idx > 0) {
          var prev = els.overlay.querySelector('.start-input[data-pos="' + (idx-1) + '"]');
          if (prev) { e.preventDefault(); prev.focus(); prev.select(); }
        }
        if (e.key === 'Enter') {
          e.preventDefault(); inp.blur();
          document.getElementById('quickGuessBtn').click();
        }
      };
      inp.onfocus = function() { setTimeout(function() { inp.select(); }, 0); };
    })(startInputs[k], k);
  }

  document.getElementById('quickGuessBtn').onclick = function() {
    var allFilled = true;
    for (var i = 0; i < numCount; i++) if (startVals[i] === null) allFilled = false;
    if (!allFilled) { showToast('Nhập đủ ' + numCount + ' số!', 'no'); return; }
    quickGuess(startVals);
  };

  document.getElementById('startGameBtn').onclick = function() {
    startMainGame();
  };
}

function quickGuess(vals) {
  var correct = true;
  for (var i = 0; i < numCount; i++) {
    if (vals[i] !== secret[i]) { correct = false; break; }
  }

  if (correct) {
    gameOver = true;
    var pts = calcBasePoints(level) * 2 + (numCount - 3) * 25;
    var modeBonus = { easy: 0, normal: 15, hard: 35 }[currentMode] || 0;
    pts += modeBonus;
    if (streak >= 3) pts = Math.floor(pts * 1.5);
    streak++;
    totalScore += pts;
    els.scoreTotalEl.textContent = totalScore;
    try { localStorage.setItem('turingCrayonScore', totalScore); } catch(e) {}
    saveToLB(pts);
    showQuickWin(vals, pts);
  } else {
    totalScore = Math.max(0, totalScore - 10);
    els.scoreTotalEl.textContent = totalScore;
    try { localStorage.setItem('turingCrayonScore', totalScore); } catch(e) {}
    showToast('-10 điểm', 'no');
    setTimeout(function() { startMainGame(); }, 1000);
  }
}

function showQuickWin(vals, pts) {
  var html = '<h2 class="win">🎉 ĐOÁN ĐÚNG NGAY!</h2>';
  html += '<p>Bạn đã tìm ra dãy số từ manh mối!</p>';
  html += '<div class="secret-reveal">';
  for (var i = 0; i < vals.length; i++) html += '<div class="secret-num">' + vals[i] + '</div>';
  html += '</div>';
  html += '<p>+<b>' + pts + '</b> điểm (thưởng đoán nhanh ×2)</p>';
  html += '<button id="nextLvBtn" type="button" class="tertiary">LEVEL TIẾP ▶</button>';
  html += '<button id="againBtn" type="button" class="secondary">CHƠI LẠI</button>';
  showOverlay(html);

  document.getElementById('nextLvBtn').onclick = function() {
    level++; prepareVan();
  };
  document.getElementById('againBtn').onclick = function() {
    prepareVan();
  };
}

// ============ RENDER SLOTS ============
function renderSlots() {
  var html = '';
  for (var i = 0; i < numCount; i++) {
    html += '<div class="slot" data-slot="' + i + '">';
    html += '<div class="slot-label">Số ' + (i+1) + '</div>';
    html += '<input class="slot-main" data-slot="' + i + '" type="tel" inputmode="numeric" maxlength="1" placeholder="?" autocomplete="off">';
    html += '<div class="mini-grid" data-slot="' + i + '">';
    for (var v = minVal; v <= maxVal; v++) {
      var elim = eliminated[i] && eliminated[i][v];
      html += '<button class="mini-cell' + (elim ? ' eliminated' : '') + '" data-slot="' + i + '" data-val="' + v + '" type="button">' + v + '</button>';
    }
    html += '</div>';
    html += '</div>';
  }
  els.slotsRow.innerHTML = html;

  var cells = els.slotsRow.querySelectorAll('.mini-cell');
  for (var c = 0; c < cells.length; c++) {
    (function(cell) {
      cell.onclick = function(e) {
        if (e) e.stopPropagation();
        var slot = parseInt(cell.getAttribute('data-slot'), 10);
        var val = parseInt(cell.getAttribute('data-val'), 10);
        toggleEliminate(slot, val, cell);
      };
    })(cells[c]);
  }

  var inputs = els.slotsRow.querySelectorAll('.slot-main');
  for (var k = 0; k < inputs.length; k++) {
    (function(inp, idx) {
      inp.oninput = function() {
        if (gameOver) { inp.value = ''; return; }
        var val = inp.value.replace(/[^0-9]/g, '');
        if (val.length > 1) val = val.slice(-1);
        inp.value = val;
        if (val !== '') {
          currentGuess[idx] = parseInt(val, 10);
          inp.classList.add('filled');
          if (idx < numCount - 1) {
            var next = els.slotsRow.querySelector('.slot-main[data-slot="' + (idx+1) + '"]');
            if (next) setTimeout(function() { next.focus(); }, 50);
          }
        } else {
          currentGuess[idx] = null;
          inp.classList.remove('filled');
        }
      };
      inp.onkeydown = function(e) {
        if (e.key === 'Backspace' && inp.value === '' && idx > 0) {
          var prev = els.slotsRow.querySelector('.slot-main[data-slot="' + (idx-1) + '"]');
          if (prev) { e.preventDefault(); prev.focus(); prev.select(); }
        }
        if (e.key === 'Enter') { e.preventDefault(); inp.blur(); handleGuess(); }
      };
      inp.onfocus = function() { setTimeout(function() { inp.select(); }, 0); };
    })(inputs[k], k);
  }
}

function toggleEliminate(slot, val, cell) {
  if (gameOver) return;
  if (!eliminated[slot]) eliminated[slot] = {};
  if (eliminated[slot][val]) {
    delete eliminated[slot][val];
    cell.classList.remove('eliminated');
  } else {
    eliminated[slot][val] = true;
    cell.classList.add('eliminated');
    try { if (navigator.vibrate) navigator.vibrate(10); } catch(e) {}
  }
}

// ============ CÂU HỎI ============
function isPrime(n) {
  if (n < 2) return false;
  for (var i = 2; i * i <= n; i++) if (n % i === 0) return false;
  return true;
}

function buildAllQuestions(len) {
  len = Math.max(3, Math.min(7, parseInt(len, 10) || 3));
  var qs = [];
  var i;

  for (i = 0; i < len; i++) {
    (function(idx) {
      qs.push({
        id: 'even_' + idx, tier: 1,
        text: 'Số thứ ' + (idx+1) + ' là số chẵn?',
        fn: function(s) { return s[idx] % 2 === 0; },
        affects: [{ slot: idx, when: function(ans, v) {
          // Nếu CÓ: loại số lẻ. Nếu KHÔNG: loại số chẵn
          return ans ? (v % 2 !== 0) : (v % 2 === 0);
        }}],
        reason: function(s) { return 'Số thứ ' + (idx+1) + ' là ' + s[idx] + ' — ' + (s[idx]%2===0 ? 'số chẵn' : 'số lẻ') + '.'; }
      });
    })(i);
  }
  for (i = 0; i < len; i++) {
    (function(idx) {
      qs.push({
        id: 'gt5_' + idx, tier: 1,
        text: 'Số thứ ' + (idx+1) + ' lớn hơn 5?',
        fn: function(s) { return s[idx] > 5; },
        affects: [{ slot: idx, when: function(ans, v) {
          return ans ? (v <= 5) : (v > 5);
        }}],
        reason: function(s) { return 'Số thứ ' + (idx+1) + ' là ' + s[idx] + ' — ' + (s[idx]>5 ? 'lớn hơn 5' : 'không lớn hơn 5') + '.'; }
      });
    })(i);
  }
  for (i = 0; i < len - 1; i++) {
    (function(idx) {
      qs.push({
        id: 'cmp_' + idx, tier: 2,
        text: 'Số thứ ' + (idx+1) + ' lớn hơn số thứ ' + (idx+2) + '?',
        fn: function(s) { return s[idx] > s[idx+1]; },
        reason: function(s) { return s[idx] + ' ' + (s[idx]>s[idx+1] ? '>' : '≤') + ' ' + s[idx+1] + '.'; }
      });
    })(i);
  }
  if (len >= 3) {
    qs.push({
      id: 'cmp_first_last', tier: 2,
      text: 'Số đầu lớn hơn số cuối?',
      fn: function(s) { return s[0] > s[len-1]; },
      reason: function(s) { return s[0] + ' ' + (s[0]>s[len-1] ? '>' : '≤') + ' ' + s[len-1] + '.'; }
    });
    qs.push({
      id: 'eq_first_last', tier: 2,
      text: 'Số đầu bằng số cuối?',
      fn: function(s) { return s[0] === s[len-1]; },
      reason: function(s) { return s[0] + (s[0]===s[len-1] ? ' = ' : ' ≠ ') + s[len-1] + '.'; }
    });
  }
  qs.push({
    id: 'sum_even', tier: 2,
    text: 'Tổng các số là số chẵn?',
    fn: function(s) { var t=0; for (var k=0;k<s.length;k++) t+=s[k]; return t%2===0; },
    reason: function(s) { var t=0; for (var k=0;k<s.length;k++) t+=s[k]; return 'Tổng = ' + t + ' — ' + (t%2===0 ? 'số chẵn' : 'số lẻ') + '.'; }
  });
  qs.push({
    id: 'sum_gt', tier: 2,
    text: 'Tổng các số lớn hơn ' + Math.floor(len * 4.5) + '?',
    fn: function(s) { var t=0; for (var k=0;k<s.length;k++) t+=s[k]; return t > Math.floor(len*4.5); },
    reason: function(s) { var t=0; for (var k=0;k<s.length;k++) t+=s[k]; return 'Tổng = ' + t + '.'; }
  });
  qs.push({
    id: 'sum_div3', tier: 2,
    text: 'Tổng các số chia hết cho 3?',
    fn: function(s) { var t=0; for (var k=0;k<s.length;k++) t+=s[k]; return t%3===0; },
    reason: function(s) { var t=0; for (var k=0;k<s.length;k++) t+=s[k]; return 'Tổng = ' + t + ' — ' + (t%3===0 ? 'chia hết 3' : 'không chia hết 3') + '.'; }
  });
  qs.push({
    id: 'diff_gt5', tier: 3,
    text: 'Hiệu số lớn nhất và nhỏ nhất > 5?',
    fn: function(s) {
      var mx=s[0], mn=s[0];
      for (var k=1;k<s.length;k++){if(s[k]>mx)mx=s[k];if(s[k]<mn)mn=s[k];}
      return (mx-mn) > 5;
    },
    reason: function(s) {
      var mx=s[0], mn=s[0];
      for (var k=1;k<s.length;k++){if(s[k]>mx)mx=s[k];if(s[k]<mn)mn=s[k];}
      return 'Hiệu = ' + (mx-mn) + '.';
    }
  });
  var checkNums = [0, 3, 5, 7, 9];
  for (i = 0; i < checkNums.length; i++) {
    (function(n) {
      qs.push({
        id: 'has_' + n, tier: 1,
        text: 'Dãy có chứa số ' + n + '?',
        fn: function(s) { return s.indexOf(n) !== -1; },
        affects: function() {
          // Nếu KHÔNG: loại n ở tất cả slots
          return [{ slot: -1, when: function(ans, v) { return !ans && v === n; } }];
        }(),
        reason: function(s) { return s.indexOf(n) !== -1 ? 'Có số ' + n + ' trong dãy.' : 'Không có số ' + n + '.'; }
      });
    })(checkNums[i]);
  }
  qs.push({
    id: 'even_more', tier: 2,
    text: 'Có nhiều số chẵn hơn số lẻ?',
    fn: function(s) { var e=0; for (var k=0;k<s.length;k++) if(s[k]%2===0)e++; return e > s.length-e; },
    reason: function(s) { var e=0,o=0; for (var k=0;k<s.length;k++) { if(s[k]%2===0)e++; else o++; } return 'Có ' + e + ' chẵn, ' + o + ' lẻ.'; }
  });
  qs.push({
    id: 'has_dup', tier: 2,
    text: 'Có 2 số bằng nhau?',
    fn: function(s) { for (var a=0;a<s.length;a++) for (var b=a+1;b<s.length;b++) if(s[a]===s[b])return true; return false; },
    reason: function(s) {
      for (var a=0;a<s.length;a++) for (var b=a+1;b<s.length;b++) if(s[a]===s[b]) return 'Số ' + s[a] + ' xuất hiện nhiều lần.';
      return 'Các số đều khác nhau.';
    }
  });
  qs.push({
    id: 'increasing', tier: 2,
    text: 'Dãy tăng dần?',
    fn: function(s) { for (var k=1;k<s.length;k++) if(s[k]<=s[k-1])return false; return true; },
    reason: function(s) {
      for (var k=1;k<s.length;k++) if(s[k]<=s[k-1]) return 'Không tăng: ' + s[k-1] + ' ≥ ' + s[k] + '.';
      return 'Tăng dần.';
    }
  });
  qs.push({
    id: 'max_first', tier: 2,
    text: 'Số đầu là số lớn nhất?',
    fn: function(s) { for (var k=1;k<s.length;k++) if(s[k]>s[0])return false; return true; },
    reason: function(s) { var mx=Math.max.apply(null,s); return 'Max = ' + mx + (s[0]===mx ? ' (số đầu).' : '.'); }
  });
  qs.push({
    id: 'first_zero', tier: 2,
    text: 'Số đầu tiên là số 0?',
    fn: function(s) { return s[0] === 0; },
        affects: [{ slot: 0, when: function(ans, v) { return ans ? (v !== 0) : (v === 0); } }],
    reason: function(s) { return 'Số đầu = ' + s[0] + '.'; }
  });
  qs.push({
    id: 'no_zero', tier: 1,
    text: 'Dãy không có số 0?',
    fn: function(s) { return s.indexOf(0) === -1; },
    affects: [{ slot: -1, when: function(ans, v) { return ans && v === 0; } }],
    reason: function(s) { return s.indexOf(0)===-1 ? 'Không có số 0.' : 'Có số 0.'; }
  });
  qs.push({
    id: 'is_prime_first', tier: 2,
    text: 'Số đầu tiên là số nguyên tố?',
    fn: function(s) { return isPrime(s[0]); },
    reason: function(s) { return s[0] + (isPrime(s[0]) ? ' là số nguyên tố.' : ' không phải số nguyên tố.'); }
  });
  qs.push({
    id: 'sum_prime', tier: 3,
    text: 'Tổng các số là số nguyên tố?',
    fn: function(s) { var t=0; for (var k=0;k<s.length;k++) t+=s[k]; return isPrime(t); },
    reason: function(s) { var t=0; for (var k=0;k<s.length;k++) t+=s[k]; return 'Tổng = ' + t + (isPrime(t) ? ' là số nguyên tố.' : ' không phải số nguyên tố.'); }
  });
  qs.push({
    id: 'ap3', tier: 3,
    text: 'Có 3 số tạo cấp số cộng?',
    fn: function(s) {
      var a = s.slice().sort(function(x,y){return x-y;});
      for (var x=0;x<a.length-2;x++)
        for (var y=x+1;y<a.length-1;y++)
          for (var z=y+1;z<a.length;z++)
            if (a[y]-a[x] === a[z]-a[y] && a[z]-a[y] > 0) return true;
      return false;
    },
    reason: function(s) {
      var a = s.slice().sort(function(x,y){return x-y;});
      for (var x=0;x<a.length-2;x++)
        for (var y=x+1;y<a.length-1;y++)
          for (var z=y+1;z<a.length;z++)
            if (a[y]-a[x] === a[z]-a[y] && a[z]-a[y] > 0)
              return 'Có: ' + a[x] + ', ' + a[y] + ', ' + a[z] + '.';
      return 'Không có.';
    }
  });
  qs.push({
    id: 'sum_pair_10', tier: 3,
    text: 'Có 2 số cộng lại bằng 10?',
    fn: function(s) {
      for (var a=0;a<s.length;a++) for (var b=a+1;b<s.length;b++) if(s[a]+s[b]===10)return true;
      return false;
    },
    reason: function(s) {
      for (var a=0;a<s.length;a++) for (var b=a+1;b<s.length;b++) if(s[a]+s[b]===10)
        return s[a] + ' + ' + s[b] + ' = 10.';
      return 'Không có cặp nào cộng = 10.';
    }
  });
  qs.push({
    id: 'consec_diff1', tier: 3,
    text: 'Có 2 số chênh lệch đúng 1?',
    fn: function(s) {
      for (var a=0;a<s.length;a++) for (var b=a+1;b<s.length;b++) if(Math.abs(s[a]-s[b])===1)return true;
      return false;
    },
    reason: function(s) {
      for (var a=0;a<s.length;a++) for (var b=a+1;b<s.length;b++) if(Math.abs(s[a]-s[b])===1)
        return s[a] + ' và ' + s[b] + ' chênh 1.';
      return 'Không có cặp chênh 1.';
    }
  });
  qs.push({
    id: 'has_square', tier: 2,
    text: 'Có số nào là số chính phương? (0,1,4,9)',
    fn: function(s) {
      for (var k=0;k<s.length;k++) if([0,1,4,9].indexOf(s[k])!==-1) return true;
      return false;
    },
    reason: function(s) {
      var found = [];
      for (var k=0;k<s.length;k++) if([0,1,4,9].indexOf(s[k])!==-1) found.push(s[k]);
      return found.length ? 'Có: ' + found.join(', ') + '.' : 'Không có số chính phương.';
    }
  });
  qs.push({
    id: 'has_mult5', tier: 2,
    text: 'Có số nào chia hết cho 5? (0,5)',
    fn: function(s) {
      for (var k=0;k<s.length;k++) if(s[k] % 5 === 0) return true;
      return false;
    },
    reason: function(s) {
      var found = [];
      for (var k=0;k<s.length;k++) if(s[k]%5===0) found.push(s[k]);
      return found.length ? 'Có: ' + found.join(', ') + '.' : 'Không có.';
    }
  });
  qs.push({
    id: 'avg_gt5', tier: 2,
    text: 'Trung bình cộng > 5?',
    fn: function(s) {
      var t=0; for (var k=0;k<s.length;k++) t+=s[k];
      return (t / s.length) > 5;
    },
    reason: function(s) {
      var t=0; for (var k=0;k<s.length;k++) t+=s[k];
      return 'TB = ' + (t/s.length).toFixed(1) + '.';
    }
  });
  qs.push({
    id: 'has_3_consec', tier: 3,
    text: 'Có 3 số liên tiếp trong dãy? (VD: 2,3,4)',
    fn: function(s) {
      var a = s.slice().sort(function(x,y){return x-y;});
      for (var x=0;x<a.length-2;x++)
        if (a[x+1] === a[x]+1 && a[x+2] === a[x]+2) return true;
      return false;
    },
    reason: function(s) {
      var a = s.slice().sort(function(x,y){return x-y;});
      for (var x=0;x<a.length-2;x++)
        if (a[x+1] === a[x]+1 && a[x+2] === a[x]+2)
          return 'Có: ' + a[x] + ', ' + a[x+1] + ', ' + a[x+2] + '.';
      return 'Không có 3 số liên tiếp.';
    }
  });
  qs.push({
    id: 'max_minus_min_even', tier: 3,
    text: 'Hiệu max - min là số chẵn?',
    fn: function(s) {
      var mx = Math.max.apply(null, s);
      var mn = Math.min.apply(null, s);
      return (mx - mn) % 2 === 0;
    },
    reason: function(s) {
      var mx = Math.max.apply(null, s);
      var mn = Math.min.apply(null, s);
      return 'Hiệu = ' + (mx-mn) + '.';
    }
  });

  return qs;
}

// ============ BUILD / RENDER QUESTIONS ============
function buildQuestionsList() {
  numCount = Math.max(3, Math.min(7, parseInt(numCount, 10) || 3));
  allQuestionsCache = buildAllQuestions(numCount);

  for (var i = allQuestionsCache.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = allQuestionsCache[i];
    allQuestionsCache[i] = allQuestionsCache[j];
    allQuestionsCache[j] = tmp;
  }

  renderQuestions();
}

function renderQuestions() {
  var list = allQuestionsCache;
  if (currentFilter !== 'all') {
    var tier = currentFilter === 'tier1' ? 1 : currentFilter === 'tier2' ? 2 : 3;
    list = list.filter(function(q) { return q.tier === tier; });
  }

  els.questionsListEl.innerHTML = '';
  for (var i = 0; i < list.length; i++) {
    (function(q) {
      var btn = document.createElement('button');
      btn.className = 'q-btn';
      btn.type = 'button';

      var status = askedMap[q.id];
      if (status) btn.classList.add('used', status);

      if (status && q.askOrder) {
        var numSpan = document.createElement('span');
        numSpan.className = 'q-num';
        numSpan.textContent = q.askOrder + '.';
        btn.appendChild(numSpan);
      }

      var dot = document.createElement('span');
      dot.className = 'q-dot tier' + q.tier;
      btn.appendChild(dot);

      var txt = document.createElement('span');
      txt.className = 'q-text';
      txt.textContent = q.text;
      btn.appendChild(txt);

      if (status) {
        var ansSpan = document.createElement('span');
        ansSpan.className = 'q-answer';
        ansSpan.textContent = status === 'yes' ? '= CÓ' : '= KHÔNG';
        btn.appendChild(ansSpan);
      } else {
        var cost = getQuestionCost(q.tier);
        var costSpan = document.createElement('span');
        costSpan.className = 'q-cost';
        costSpan.textContent = '(-' + cost + 'đ)';
        btn.appendChild(costSpan);
      }

      btn.onclick = function(e) {
        if (e) { e.preventDefault(); e.stopPropagation(); }
        handleQuestionClick(q, btn);
      };

      els.questionsListEl.appendChild(btn);
    })(list[i]);
  }
}

// ============ HANDLE CLICK ============
function handleQuestionClick(q, btn) {
  if (gameOver) return;
  if (questionsLeft <= 0) { showToast('Hết câu hỏi!', 'no'); return; }
  if (askedMap[q.id]) return;

  var answer = !!q.fn(secret);
  var status = answer ? 'yes' : 'no';
  askedMap[q.id] = status;
  questionCounter++;
  q.askOrder = questionCounter;
  questionsLeft--;

  var reason = '';
  if (q.reason) {
    try { reason = q.reason(secret); } catch(e) {}
  }
  askedLog.push({
    order: questionCounter,
    text: q.text,
    answer: answer,
    tier: q.tier,
    reason: reason,
    affects: q.affects || null
  });

  updateQuestionButton(btn, q, status);
  showToast(answer ? 'CÓ ✓' : 'KHÔNG ✗', status);
  els.qLeftEl.textContent = questionsLeft;
  pulseStat(els.qStat);

  if (questionsLeft === 0) showToast('Hết câu hỏi!', 'no');
}

function updateQuestionButton(btn, q, status) {
  btn.classList.add('used', status);
  btn.innerHTML = '';

  var numSpan = document.createElement('span');
  numSpan.className = 'q-num';
  numSpan.textContent = (q.askOrder || '') + '.';
  btn.appendChild(numSpan);

  var dot = document.createElement('span');
  dot.className = 'q-dot tier' + q.tier;
  btn.appendChild(dot);

  var txt = document.createElement('span');
  txt.className = 'q-text';
  txt.textContent = q.text;
  btn.appendChild(txt);

  var ansSpan = document.createElement('span');
  ansSpan.className = 'q-answer';
  ansSpan.textContent = status === 'yes' ? '= CÓ' : '= KHÔNG';
  btn.appendChild(ansSpan);
}

// ============ FORM TỰ HỎI ============
function showCustomForm() {
  if (gameOver) { showToast('Ván đã kết thúc!', 'no'); return; }
  if (questionsLeft <= 0) { showToast('Hết câu hỏi!', 'no'); return; }

  var html = '<div class="form-overlay">';

  html += '<div class="form-row">';

  html += '<select id="tplSelect" style="flex:1">';
  html += '<option value="even">Số thứ [X] là số chẵn?</option>';
  html += '<option value="gt5">Số thứ [X] lớn hơn 5?</option>';
  html += '<option value="cmp">Số thứ [X] lớn hơn số thứ [Y]?</option>';
  html += '<option value="eq">Số thứ [X] bằng số thứ [Y]?</option>';
  html += '<option value="gtnum">Số thứ [X] lớn hơn [Y]?</option>';
  html += '<option value="ltnum">Số thứ [X] nhỏ hơn [Y]?</option>';
  html += '<option value="hasnum">Dãy có chứa số [Y]?</option>';
  html += '</select>';
  html += '</div>';

  html += '<div class="form-row" id="paramRow1">';
  html += '<label>X:</label>';
  html += '<select id="paramX"></select>';
  html += '</div>';

  html += '<div class="form-row" id="paramRow2" style="display:none">';
  html += '<label id="paramYLabel">Y:</label>';
  html += '<select id="paramY"></select>';
  html += '</div>';

  html += '<div class="form-preview" id="previewBox">Số thứ 1 là số chẵn?</div>';
  html += '<div class="form-cost" id="costBox">Chi phí: -15đ</div>';

  html += '<div class="form-btns">';
  html += '<button id="submitCustomBtn" type="button" class="tertiary">HỎI ✓</button>';
  html += '<button id="cancelCustomBtn" type="button" class="cancel">HỦY</button>';
  html += '</div>';
  html += '</div>';

  showOverlay(html);

  var selX = document.getElementById('paramX');
  for (var x = 1; x <= numCount; x++) {
    var opt = document.createElement('option');
    opt.value = x;
    opt.textContent = x;
    selX.appendChild(opt);
  }

  var tplSelect = document.getElementById('tplSelect');
  var paramRow2 = document.getElementById('paramRow2');
  var paramYLabel = document.getElementById('paramYLabel');
  var selY = document.getElementById('paramY');
  var previewBox = document.getElementById('previewBox');
  var costBox = document.getElementById('costBox');

  function getTemplateTier(tpl) {
    if (tpl === 'even' || tpl === 'gt5' || tpl === 'hasnum') return 1;
    if (tpl === 'cmp' || tpl === 'eq') return 2;
    if (tpl === 'gtnum' || tpl === 'ltnum') return 2;
    return 2;
  }

  function refreshParams() {
    var tpl = tplSelect.value;
    selY.innerHTML = '';

    if (tpl === 'cmp' || tpl === 'eq') {
      paramRow2.style.display = 'flex';
      paramYLabel.textContent = 'Y (số thứ):';
      for (var i = 1; i <= numCount; i++) {
        var opt = document.createElement('option');
        opt.value = i;
        opt.textContent = i;
        selY.appendChild(opt);
      }
    } else if (tpl === 'gtnum' || tpl === 'ltnum' || tpl === 'hasnum') {
      paramRow2.style.display = 'flex';
      paramYLabel.textContent = 'Y (số 0-9):';
      for (var v = 0; v <= 9; v++) {
        var opt2 = document.createElement('option');
        opt2.value = v;
        opt2.textContent = v;
        selY.appendChild(opt2);
      }
    } else {
      paramRow2.style.display = 'none';
    }
    updatePreview();
  }

  function updatePreview() {
    var tpl = tplSelect.value;
    var x = parseInt(selX.value, 10);
    var y = parseInt(selY.value, 10);
    var text = '';

    if (tpl === 'even') text = 'Số thứ ' + x + ' là số chẵn?';
    else if (tpl === 'gt5') text = 'Số thứ ' + x + ' lớn hơn 5?';
    else if (tpl === 'cmp') text = 'Số thứ ' + x + ' lớn hơn số thứ ' + y + '?';
    else if (tpl === 'eq') text = 'Số thứ ' + x + ' bằng số thứ ' + y + '?';
    else if (tpl === 'gtnum') text = 'Số thứ ' + x + ' lớn hơn ' + y + '?';
    else if (tpl === 'ltnum') text = 'Số thứ ' + x + ' nhỏ hơn ' + y + '?';
    else if (tpl === 'hasnum') text = 'Dãy có chứa số ' + y + '?';

    previewBox.textContent = text;

    var tier = getTemplateTier(tpl);
    costBox.textContent = 'Chi phí: -' + getQuestionCost(tier) + 'đ';
  }

  tplSelect.onchange = refreshParams;
  selX.onchange = updatePreview;
  selY.onchange = updatePreview;

  refreshParams();

  document.getElementById('submitCustomBtn').onclick = function() {
    var tpl = tplSelect.value;
    var x = parseInt(selX.value, 10);
    var y = parseInt(selY.value, 10);

    if (tpl === 'cmp' || tpl === 'eq') {
      if (x === y) { showToast('X phải khác Y!', 'no'); return; }
    }

    var customQ = buildCustomQuestion(tpl, x, y);
    if (!customQ) { showToast('Lỗi tạo câu hỏi!', 'no'); return; }

    // Kiểm tra trùng
    for (var k = 0; k < allQuestionsCache.length; k++) {
      if (allQuestionsCache[k].text === customQ.text && !askedMap[allQuestionsCache[k].id]) {
        hideOverlay();
        var btnFound = findQuestionButton(allQuestionsCache[k].id);
        if (btnFound) handleQuestionClick(allQuestionsCache[k], btnFound);
        else handleQuestionClickNoButton(allQuestionsCache[k]);
        return;
      }
    }

    allQuestionsCache.unshift(customQ);
    hideOverlay();
    renderQuestions();
    var newBtn = findQuestionButton(customQ.id);
    if (newBtn) handleQuestionClick(customQ, newBtn);
    else handleQuestionClickNoButton(customQ);
  };

  document.getElementById('cancelCustomBtn').onclick = function() {
    hideOverlay();
  };
}

function buildCustomQuestion(tpl, x, y) {
  var id = 'custom_' + Date.now();
  if (tpl === 'even') {
    return {
      id: id, tier: 1,
      text: 'Số thứ ' + x + ' là số chẵn?',
      fn: function(s) { return s[x-1] % 2 === 0; },
      affects: [{ slot: x-1, when: function(ans, v) { return ans ? (v % 2 !== 0) : (v % 2 === 0); } }],
      reason: function(s) { return 'Số thứ ' + x + ' là ' + s[x-1] + '.'; }
    };
  }
  if (tpl === 'gt5') {
    return {
      id: id, tier: 1,
      text: 'Số thứ ' + x + ' lớn hơn 5?',
      fn: function(s) { return s[x-1] > 5; },
      affects: [{ slot: x-1, when: function(ans, v) { return ans ? (v <= 5) : (v > 5); } }],
      reason: function(s) { return 'Số thứ ' + x + ' là ' + s[x-1] + '.'; }
    };
  }
  if (tpl === 'cmp') {
    return {
      id: id, tier: 2,
      text: 'Số thứ ' + x + ' lớn hơn số thứ ' + y + '?',
      fn: function(s) { return s[x-1] > s[y-1]; },
      reason: function(s) { return s[x-1] + ' ' + (s[x-1]>s[y-1]?'>':'≤') + ' ' + s[y-1] + '.'; }
    };
  }
  if (tpl === 'eq') {
    return {
      id: id, tier: 2,
      text: 'Số thứ ' + x + ' bằng số thứ ' + y + '?',
      fn: function(s) { return s[x-1] === s[y-1]; },
      reason: function(s) { return s[x-1] + (s[x-1]===s[y-1]?' = ':' ≠ ') + s[y-1] + '.'; }
    };
  }
  if (tpl === 'gtnum') {
    return {
      id: id, tier: 2,
      text: 'Số thứ ' + x + ' lớn hơn ' + y + '?',
      fn: function(s) { return s[x-1] > y; },
      affects: [{ slot: x-1, when: function(ans, v) { return ans ? (v <= y) : (v > y); } }],
      reason: function(s) { return 'Số thứ ' + x + ' là ' + s[x-1] + '.'; }
    };
  }
  if (tpl === 'ltnum') {
    return {
      id: id, tier: 2,
      text: 'Số thứ ' + x + ' nhỏ hơn ' + y + '?',
      fn: function(s) { return s[x-1] < y; },
      affects: [{ slot: x-1, when: function(ans, v) { return ans ? (v >= y) : (v < y); } }],
      reason: function(s) { return 'Số thứ ' + x + ' là ' + s[x-1] + '.'; }
    };
  }
  if (tpl === 'hasnum') {
    return {
      id: id, tier: 1,
      text: 'Dãy có chứa số ' + y + '?',
      fn: function(s) { return s.indexOf(y) !== -1; },
      affects: [{ slot: -1, when: function(ans, v) { return !ans && v === y; } }],
      reason: function(s) { return s.indexOf(y)!==-1 ? 'Có số ' + y + '.' : 'Không có số ' + y + '.'; }
    };
  }
  return null;
}

function findQuestionButton(qid) {
  var btns = els.questionsListEl.querySelectorAll('.q-btn');
  for (var i = 0; i < btns.length; i++) {
    if (btns[i].getAttribute('data-qid') === qid) return btns[i];
  }
  return null;
}

    affects: q.affects || null
  });

  showToast(answer ? 'CÓ ✓' : 'KHÔNG ✗', status);
  els.qLeftEl.textContent = questionsLeft;
  pulseStat(els.qStat);

  renderQuestions();

  if (questionsLeft === 0) showToast('Hết câu hỏi!', 'no');
}

// ============ HANDLE GUESS ============
function handleGuess() {
  if (gameOver) { showToast('Ván đã kết thúc!', 'no'); return; }
  for (var i = 0; i < numCount; i++) {
    if (currentGuess[i] === null || currentGuess[i] === undefined) {
      showToast('Nhập đủ ' + numCount + ' số!', 'no');
      return;
    }
  }
  checkGuess();
}

// ============ CHECK ============
function checkGuess() {
  var correct = true;
  for (var i = 0; i < numCount; i++) {
    if (currentGuess[i] !== secret[i]) { correct = false; break; }
  }

  gameOver = true;
  els.guessBtn.disabled = true;

  var questionsUsed = questionsTotal - questionsLeft;
  var points = 0;

  if (correct) {
    var base = calcBasePoints(level);
    var modeBonus = { easy: 0, normal: 15, hard: 35 }[currentMode] || 0;
    var lengthBonus = (numCount - 3) * 25;
    var cost = 0;
    for (var k = 0; k < askedLog.length; k++) {
      cost += getQuestionCost(askedLog[k].tier);
    }
    points = base + modeBonus + lengthBonus - cost;
    points = Math.max(0, points);
    streak++;
    if (streak >= 3) points = Math.floor(points * 1.5);
    totalScore += points;
    els.scoreTotalEl.textContent = totalScore;
    try { localStorage.setItem('turingCrayonScore', totalScore); } catch(e) {}
    saveToLB(points);
  } else {
    streak = 0;
    totalScore = Math.max(0, totalScore - 10);
    els.scoreTotalEl.textContent = totalScore;
    try { localStorage.setItem('turingCrayonScore', totalScore); } catch(e) {}
  }

  showResult(correct, points, questionsUsed);
}

function saveToLB(points) {
  try {
    var lb = JSON.parse(localStorage.getItem('turingCrayonLB') || '[]');
    lb.push({ name: playerName, score: points, level: level, mode: currentMode, date: Date.now() });
    lb.sort(function(a, b) { return b.score - a.score; });
    lb = lb.slice(0, 10);
    localStorage.setItem('turingCrayonLB', JSON.stringify(lb));
  } catch(e) {}
}

// ============ GIẢI THÍCH TỪNG SỐ ============
function buildSlotExplanation(slotIdx) {
  // Trả về mảng các bước giải thích cho số thứ slotIdx
  var steps = [];
  var remaining = [];
  for (var v = minVal; v <= maxVal; v++) remaining.push(v);

  // Duyệt từng câu hỏi đã hỏi
  for (var i = 0; i < askedLog.length; i++) {
    var item = askedLog[i];
    var eliminated = [];
    
    // Kiểm tra xem câu hỏi có ảnh hưởng đến slot này không
    if (item.affects && item.affects.length) {
      for (var a = 0; a < item.affects.length; a++) {
        var aff = item.affects[a];
        // slot = -1 nghĩa là áp dụng cho tất cả các slot
        if (aff.slot === slotIdx || aff.slot === -1) {
          // Tìm các số bị loại
          for (var r = 0; r < remaining.length; r++) {
            if (aff.when(item.answer, remaining[r])) {
              eliminated.push(remaining[r]);
            }
          }
          // Loại khỏi remaining
          if (eliminated.length > 0) {
            remaining = remaining.filter(function(v) { return eliminated.indexOf(v) === -1; });
          }
        }
      }
    }

    if (eliminated.length > 0) {
      steps.push({
        order: item.order,
        text: item.text,
        answer: item.answer,
        eliminated: eliminated.slice(),
        remaining: remaining.slice()
      });
    }
  }

  return {
    slot: slotIdx,
    secret: secret[slotIdx],
    steps: steps,
    finalRemaining: remaining
  };
}

// ============ RESULT + GIẢI THÍCH TỪNG SỐ ============
function showResult(correct, points, questionsUsed) {
  var html = '';
  if (correct) {
    html += '<h2 class="win">🎉 PHÁ MÃ THÀNH CÔNG!</h2>';
    html += '<p>Sau <b>' + questionsUsed + '</b> câu hỏi, bạn đã tìm ra:</p>';
  } else {
    html += '<h2>😅 CHƯA ĐÚNG</h2>';
    html += '<p>Dãy đúng là:</p>';
  }

  html += '<div class="secret-reveal">';
  for (var i = 0; i < secret.length; i++) {
    html += '<div class="secret-num">' + secret[i] + '</div>';
  }
  html += '</div>';

  if (correct) {
    html += '<p>+<b>' + points + '</b> điểm' + (streak > 1 ? ' 🔥 Chuỗi ' + streak : '') + '</p>';
  } else {
    html += '<p>Bạn đoán: ' + currentGuess.slice(0, numCount).join(' - ') + '</p>';
    html += '<p style="font-size:11px;color:#ef476f">-10 điểm</p>';
  }

  // BẢNG GIẢI THÍCH TỪNG SỐ
  if (askedLog.length === 0) {
    html += '<div class="explain-box">';
    html += '<h4>📖 GIẢI THÍCH</h4>';
    html += '<div class="explain-empty">Bạn đoán không cần hỏi câu nào! 🎯</div>';
    html += '</div>';
  } else {
    html += '<div class="explain-box">';
    html += '<h4>📖 GIẢI THÍCH TỪNG SỐ</h4>';
    
    // Manh mối khởi động
    html += '<div class="explain-summary">';
    html += '🎲 Manh mối: <b>' + escapeHtml(currentHint) + '</b>';
    html += '</div>';

    // Từng số
    for (var s = 0; s < numCount; s++) {
      var exp = buildSlotExplanation(s);
      html += '<div class="explain-slot">';
      html += '<div class="explain-slot-header">📍 SỐ ' + (s+1) + ' = <b>' + exp.secret + '</b></div>';
      
      if (exp.steps.length === 0) {
        html += '<div class="explain-step step-clue">Không có câu hỏi nào ảnh hưởng trực tiếp</div>';
      } else {
        for (var st = 0; st < exp.steps.length; st++) {
          var step = exp.steps[st];
          var cls = 'step-' + (step.answer ? 'yes' : 'no');
          html += '<div class="explain-step ' + cls + '">';
          html += '<span class="step-q">' + step.order + '. ' + escapeHtml(step.text) + '</span> ';
          html += '<span class="step-ans">→ ' + (step.answer ? 'CÓ' : 'KHÔNG') + '</span>';
          html += '<br><span class="step-elim">❌ Loại: ' + step.eliminated.join(', ') + '</span>';
          html += ' <span class="step-remain">→ Còn: ' + (step.remaining.length ? step.remaining.join(', ') : 'không còn') + '</span>';
          html += '</div>';
        }
      }

      // Kết quả cuối
      if (exp.finalRemaining.length === 1) {
        html += '<div class="explain-result">✅ Sau khi loại trừ: còn ' + exp.finalRemaining[0] + '</div>';
      } else if (exp.finalRemaining.length > 1) {
        html += '<div class="explain-result">🔍 Còn lại: ' + exp.finalRemaining.join(', ') + ' — cần thêm manh mối</div>';
      } else if (exp.steps.length > 0) {
        html += '<div class="explain-result">✅ Đã loại hết, kết quả: ' + exp.secret + '</div>';
      }
      html += '</div>';
    }
    html += '</div>';
  }

  // Leaderboard
  var lb = [];
  try { lb = JSON.parse(localStorage.getItem('turingCrayonLB') || '[]'); } catch(e) {}
  if (lb.length > 0) {
    html += '<div class="leaderboard"><h3>🏆 TOP 10</h3>';
    for (var m = 0; m < Math.min(lb.length, 10); m++) {
      var medal = m===0?'🥇':m===1?'🥈':m===2?'🥉':(m+1)+'.';
      html += '<div class="lb-row"><span class="rank">'+medal+'</span><span class="name">'+escapeHtml(lb[m].name)+'</span><span class="pts">'+lb[m].score+'</span></div>';
    }
    html += '</div>';
  }

  if (correct) {
    html += '<button id="nextLvBtn" type="button" class="tertiary">LEVEL TIẾP ▶</button>';
    html += '<button id="againBtn" type="button" class="secondary">CHƠI LẠI</button>';
  } else {
    html += '<button id="againBtn" type="button">THỬ LẠI 🔁</button>';
    html += '<button id="changeModeBtn" type="button" class="secondary">Đổi chế độ</button>';
  }

  showOverlay(html);

  if (correct) {
    document.getElementById('nextLvBtn').onclick = function() {
      level++;
      els.levelStatEl.textContent = level;
      prepareVan();
    };
    document.getElementById('againBtn').onclick = function() { prepareVan(); };
  } else {
    document.getElementById('againBtn').onclick = function() { prepareVan(); };
    document.getElementById('changeModeBtn').onclick = function() { level = 1; showModeSelect(); };
  }
}

// ============ UTILS ============
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

})();
</script>
